<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밴드글 메이커 v1.0</title>
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#f0ede8;--border:#e0dbd4;--border2:#ccc8c0;--text:#1a1816;--text2:#6b6760;--text3:#a8a49e;--accent:#2d6a4f;--accent-light:#e8f4ee;--band:#00c73c;--warn:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:13px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:10px}
.logo{font-size:15px;font-weight:700}.logo span{color:var(--band)}
.ver{font-size:10px;color:var(--accent);background:var(--accent-light);border:1px solid #b7ddc8;padding:2px 7px;border-radius:20px;font-weight:700}
#status{margin-left:auto;font-size:11px;color:var(--text3)}
.main{max-width:1180px;margin:0 auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.panel-head{padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px}
.panel-head .cnt{margin-left:auto;font-weight:400;font-size:11px;color:var(--text3)}
.panel-body{padding:12px}
textarea{width:100%;border:1px solid var(--border2);border-radius:6px;padding:10px 12px;font-family:inherit;font-size:13px;line-height:1.7;resize:vertical;outline:none;background:#fff}
textarea:focus{border-color:var(--accent)}
.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--band);color:#fff;border-color:var(--band)}
.btn.green{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.copy{color:var(--accent);border-color:#b7ddc8;background:var(--accent-light)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.count-pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.count-pill.ok{background:#e8f4ee;color:var(--accent)}
.count-pill.short{background:#fef3c7;color:var(--warn)}
.hint{font-size:11px;color:var(--text3);line-height:1.6}
.item{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.item-head{padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:#fff}
.item-head:hover{background:var(--surface2)}
.item-title{font-weight:700;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{font-size:10px;color:var(--text3);white-space:nowrap}
.item-body{display:none;padding:12px;border-top:1px solid var(--border);background:#fbfaf8;white-space:pre-wrap;font-size:12px;line-height:1.7}
.item.open .item-body{display:block}
.btn-sm{padding:4px 9px;border-radius:5px;border:1px solid var(--border2);background:#fff;font-size:11px;cursor:pointer;font-family:inherit;color:var(--text2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:8px;opacity:0;transition:.2s;font-size:13px;z-index:9999;pointer-events:none}
.toast.on{opacity:.95}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <span class="logo">밴드글 <span>메이커</span></span>
  <span class="ver">v1.0</span>
  <span id="status">시트 연결 중...</span>
</header>
<div class="main">
  <div class="hint">📌 사용법: ① 기존 밴드글 + 게시판 글 붙여넣기 → ② [✨ 뉴 밴드글 생성] → ③ 마음에 들 때까지 직접 수정 → ④ [💾 저장] — 저장된 글이 다음 생성부터 스타일 교본이 됩니다 (쓸수록 사장님 스타일에 가까워져요)</div>
  <div class="grid">
    <div class="panel">
      <div class="panel-head">📱 원문 1 — 기존 밴드글 <span class="cnt" id="cnt-a">0자</span></div>
      <div class="panel-body"><textarea id="src-a" rows="10" placeholder="밴드에 있는 기존 글 붙여넣기" oninput="upCnt('a')"></textarea></div>
    </div>
    <div class="panel">
      <div class="panel-head">📋 원문 2 — 게시판 글 <span class="cnt" id="cnt-b">0자</span></div>
      <div class="panel-body"><textarea id="src-b" rows="10" placeholder="우리 게시판(masterc) 글 붙여넣기" oninput="upCnt('b')"></textarea></div>
    </div>
  </div>
  <div class="bar">
    <button class="btn primary" id="genBtn" onclick="generate()">✨ 뉴 밴드글 생성 (1800자)</button>
    <span class="hint" id="genHint">저장된 스타일 교본 <b id="sampleCnt">0</b>건 반영</span>
  </div>
  <div class="panel">
    <div class="panel-head">✍️ 뉴 밴드글 (직접 수정 가능)
      <span class="cnt"><span class="count-pill" id="outCnt">0자</span></span>
    </div>
    <div class="panel-body">
      <textarea id="out" rows="22" placeholder="생성 결과가 여기 나옵니다 — 마음껏 고치고 저장하세요" oninput="upOut()"></textarea>
      <div class="bar" style="margin-top:10px">
        <button class="btn green" onclick="saveBand()">💾 저장 (스타일 학습)</button>
        <button class="btn copy" onclick="copyOut()">📋 복사</button>
        <button class="btn" onclick="generate(true)">🔁 다시 생성</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">🗂 저장된 밴드글 <span class="cnt" id="listCnt"></span></div>
    <div class="panel-body" id="list"><div class="hint">불러오는 중...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const PRIVATE_KEY=`-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQDtp37rFMnb+f5e\nkpdJm8VEPbvu/Pr2cEfdLvvVxvnM/WpeIlm2GwXkck0PJUJpx2d3HZB61vScNxzN\n2uaBPf490X9o0qVJW63IJQCmWRNObcWXCxqMd9kxcFVL80PgdhN4CcjoenVMk2oV\nHjx98x5K5ivpGw2dr85RwW7JnX8xxEaa0RI0qcebNtI1xzG/O72+QAy6iw3KGgJE\nSDkLX3YMjPqYpcr45+nxUBI88k6ZdFE2y198d+csMZLPN9Zq0is0LbXaI+NFpXYg\nRoUahEEvjtM0diKwEpPnZ+hfanCFvu5rQq2wqHlVfWYOXNGa0qfnkstsXkv4bpcB\n6Fsb/ZP/AgMBAAECggEAEA8T6/W1KDit4B0evPoaK+DSDLWqjbGLoZ4VpV3zLk9n\neyHuFviffs7cdywI31X6n1lvlGVnFRFCUIS8s7oJLos0BVTKl3jq9s3NS/BT9iZD\nxk+ZRSmqEwWotd+j1AyWhzN+EHuJ5plFf1TSOJ6Pivcfu3o5AtFI60xbXKNYX3fn\nCZgcFMfdEEgUV09CfDJMZ5WZxQFj6cQU8cZxkQH4L6mxXGk2a4nDleAEsSHp53tT\nDYyGlmDdCiiHtjSFkTTZj0aI3eoGSy+5uAwyVuhNv9wZDSdShBOG+4vhFYUGI3/F\n3oNOttROq9PzbjlgFtkfkG2GbKgO5XrAob3SPubUWQKBgQD4FI4Ca6bFsMxBojfy\nWe6RaeEvSVkELD+oxLQU8mzAZRL9QB6qkDTrBabeHLmzvsbBE4knaQG3xgjCrsOC\ny7YSRqtaZtXtA5ABvzh+UAPA5Ei+ZQOAswLUvbnu+/h4rvlC3PylA+5CLAIhWfzP\n6KHmc4Pf/Gq2oirQc2lzy14OxwKBgQD1PbvtQGqFRkr3RxMW2KspgPf572E2jYXL\nTOq+4SlxJRHvWbVpQrzud2AaMMbd406VYGoRwVlfdvLMrHNMnRde5XfxlELSbywm\nQ/uI4WoQFJjHpt/SNKtykFMX6qaBgYLpBHNXfLeV0FXhhqG3K18QgIK3ZnF0s9im\n77OYgrV5CQKBgH/JJrU8enVOcohEZQkjJe4lWecfowixOkFWwWQg07/u0G8+/gzh\np0CAcsnqhgV+eaaux3FTd50QFychGnhfMnQLjuxMGFm0AhPESfdWg/hyHr5kDf/X\nNdgbupDNndmcV60HY+QkODBBtv8y+TSnIe4xBnbz8IwO0Hr7WBBbayG1AoGATDH0\nE5CyB9qBLDcO/UgwVeLWKPdxEswBx9qMDOZUQ+0ql10d+ihcHxND7p89Cm+3WL3t\n9rpGFF0WrvTdle4w9rEBBTP1VwBnjTQOEMdIdtqPZWi5ncvzgNLKnmGvfglJLTDO\nzV3YhFmIdVupHwoArVXgRy8zDPlb1PIgsL/btlECgYB4WoD0Nifwfyt84vm7Ixyi\nO9TZF0nXN20Z3JQbzV84DNTMvyG+FyGAmtTwj2gFRwrQaSXxMAr0g2RjsP2QOfL9\nXd7/MhL5p6ri9vIKcnGGd1K133ZLyWFskEPCGpYFHwanR9uT3jy+9DOtYs9xH289\n4k+8F7+ROHiYYPc5EeKr/g==\n-----END PRIVATE KEY-----\n`;
const CLIENT_EMAIL='sheets-writer@baljuseo-sheets.iam.gserviceaccount.com';
const OAUTH_SCOPE='https://www.googleapis.com/auth/spreadsheets';
const SHEET_ID='1JJkkWo3mKIFzdQHw73k4Wc_Dl_NHvrDgmabDFD9ktrk';
const DATA_TAB='밴드글';
const HEADER=['id','날짜','제목','본문','글자수','등록일시'];
const AI_PROXY_URL='https://script.google.com/macros/s/AKfycbwgjuzxTMxo8iDc-DYzFVNaPnpEePsnc0L4qTcu8EVQ9W0-ruiW64EVXyqkj6M8S1dmbw/exec';
const AI_PROXY_TOKEN='mas-x9k3p2-secretary-token';

const $=id=>document.getElementById(id);
let DATA=[], loaded=false;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function setStatus(s){$('status').textContent=s;}
function todayKST(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});}
function nowKST(){return new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function upCnt(k){$('cnt-'+k).textContent=$('src-'+k).value.length.toLocaleString()+'자';}
function upOut(){
  const n=$('out').value.length;
  const p=$('outCnt');
  p.textContent=n.toLocaleString()+'자 (공백포함)';
  p.className='count-pill '+(n>=1600?'ok':(n>0?'short':''));
}

let _tok=null,_exp=0;
async function getToken(){
  const now=Math.floor(Date.now()/1000);
  if(_tok && _exp-now>300) return _tok;
  const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  const toSign=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:CLIENT_EMAIL,scope:OAUTH_SCOPE,aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now});
  const pem=PRIVATE_KEY.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const bin=Uint8Array.from(atob(pem),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('pkcs8',bin,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,new TextEncoder().encode(toSign));
  const jwt=toSign+'.'+btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`});
  const d=await r.json(); _tok=d.access_token; _exp=now+3600; return _tok;
}
async function ensureTab(){
  const t=await getToken();
  const m=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets.properties.title`,{headers:{Authorization:`Bearer ${t}`}});
  const titles=(((await m.json()).sheets)||[]).map(s=>s.properties.title);
  if(!titles.includes(DATA_TAB)){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}:batchUpdate`,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:DATA_TAB}}}]})});
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(DATA_TAB+'!A1')}?valueInputOption=RAW`,{method:'PUT',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({values:[HEADER]})});
  }
}
async function loadAll(){
  try{
    await ensureTab();
    const t=await getToken();
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(DATA_TAB+'!A2:F')}`,{headers:{Authorization:`Bearer ${t}`}});
    const rows=(((await r.json()).values)||[]).filter(x=>String(x[0]||'').trim());
    DATA=rows.map(x=>({id:String(x[0]),date:String(x[1]||''),title:String(x[2]||''),body:String(x[3]||''),len:parseInt(x[4])||0,at:String(x[5]||'')}));
    loaded=true;
    setStatus('☁️ 시트 연결됨 · 저장본 '+DATA.length+'건');
    renderList();
  }catch(e){ setStatus('⚠️ 시트 연결 실패: '+e.message); }
}
// 저장 = append only (기존 데이터 절대 안 건드림 — 소식글 안전저장 패턴)
async function saveBand(){
  const body=$('out').value.trim();
  if(!body){ toast('저장할 글이 없어요'); return; }
  if(body.length<1000 && !confirm(body.length.toLocaleString()+'자밖에 안 되는데 저장할까요? (목표 1,800자)')) return;
  const title=(body.split('\n').map(s=>s.trim()).filter(Boolean)[0]||'제목없음').slice(0,40);
  const row=[String(Date.now()), todayKST(), title, body, String(body.length), nowKST()];
  try{
    await ensureTab();
    const t=await getToken();
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(DATA_TAB+'!A:F')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({values:[row]})});
    DATA.push({id:row[0],date:row[1],title:row[2],body:row[3],len:body.length,at:row[5]});
    renderList(); setStatus('☁️ 시트 연결됨 · 저장본 '+DATA.length+'건');
    toast('💾 저장 완료 — 다음 생성부터 이 글이 스타일 교본에 들어갑니다');
  }catch(e){ toast('⚠️ 저장 실패: '+e.message); }
}
async function delBand(id){
  if(!loaded){ toast('로드가 안 된 상태라 삭제 불가 (새로고침 후)'); return; }
  const it=DATA.find(x=>x.id===id); if(!it) return;
  if(!confirm('['+it.title+'] 저장본을 삭제할까요?')) return;
  DATA=DATA.filter(x=>x.id!==id);
  try{
    const t=await getToken();
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(DATA_TAB+'!A2:F100000')}:clear`,{method:'POST',headers:{Authorization:`Bearer ${t}`}});
    if(DATA.length) await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(DATA_TAB+'!A2')}?valueInputOption=RAW`,{method:'PUT',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({values:DATA.map(x=>[x.id,x.date,x.title,x.body,String(x.len),x.at])})});
    renderList(); toast('삭제됨');
  }catch(e){ toast('⚠️ 삭제 실패: '+e.message); loadAll(); }
}
function renderList(){
  $('sampleCnt').textContent=Math.min(DATA.length,5);
  $('listCnt').textContent=DATA.length? DATA.length+'건 (최근순)':'';
  const box=$('list');
  if(!DATA.length){ box.innerHTML='<div class="hint">아직 저장된 글이 없어요 — 첫 글을 만들어 저장하면 스타일 학습이 시작됩니다.</div>'; return; }
  box.innerHTML=[...DATA].reverse().map(x=>`<div class="item" id="it-${x.id}">
    <div class="item-head" onclick="document.getElementById('it-${x.id}').classList.toggle('open')">
      <span class="item-title">${esc(x.title)}</span>
      <span class="item-meta">${esc(x.date)} · ${(x.len||0).toLocaleString()}자</span>
      <button class="btn-sm" onclick="event.stopPropagation();copyText(${JSON.stringify(x.id)})">📋</button>
      <button class="btn-sm" style="color:#c0392b" onclick="event.stopPropagation();delBand(${JSON.stringify(x.id)})">🗑</button>
    </div>
    <div class="item-body">${esc(x.body)}</div>
  </div>`).join('');
}
function copyText(id){ const it=DATA.find(x=>x.id===id); if(!it) return; navigator.clipboard.writeText(it.body).then(()=>toast('📋 복사됨')); }
function copyOut(){ const v=$('out').value; if(!v.trim()){toast('복사할 글이 없어요');return;} navigator.clipboard.writeText(v).then(()=>toast('📋 뉴 밴드글 복사됨')); }

async function callAI(prompt,retry=0){
  const r=await fetch(AI_PROXY_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:AI_PROXY_TOKEN,prompt,attachments:[]}),redirect:'follow'});
  const d=await r.json();
  if(d.error){ if(/high demand|overload|quota|rate limit|too many|503|429/i.test(d.error)&&retry<2){await new Promise(s=>setTimeout(s,3000));return callAI(prompt,retry+1);} throw new Error(d.error); }
  return d.text||'';
}
function buildPrompt(a,b,extra){
  const samples=[...DATA].slice(-5).map((x,i)=>`《교본 ${i+1}》\n${x.body.slice(0,1500)}`).join('\n\n');
  return `너는 '마스터 유통'의 네이버 밴드 게시글 작가다.
${samples?`\n[스타일 교본 — 사장님이 최종 확정한 밴드글. 이 말투·호흡·문단 구성을 따라갈 것]\n${samples}\n`:''}
[원문 1 — 기존 밴드글]
${a}

[원문 2 — 게시판 글]
${b}

지침:
- 두 원문의 정보를 자연스럽게 버무려 하나의 새 밴드글로 재작성한다.
- 분량: 공백 포함 1,700~1,950자. 반드시 1,600자 이상. 이게 최우선 조건이다.
- 가격·구성·원산지·스펙은 원문에 있는 것만 쓰고 지어내지 말 것. 원문 정보는 빠짐없이 살릴 것.
- 부족한 분량은 그 상품의 손질법·조리법·보관법·맛있게 먹는 팁·어울리는 상황 같은 일반 상식 수준의 내용으로 보강하되 과장·허위 금지.
- 문단은 짧게 끊고 빈 줄로 구분해 밴드(모바일)에서 읽기 편하게.
- 이모지는 원문·교본 수준으로만.
${extra||''}
- 출력은 밴드글 본문만. 설명·머리말 붙이지 말 것.`;
}
async function generate(isRetry){
  const a=$('src-a').value.trim(), b=$('src-b').value.trim();
  if(!a&&!b){ toast('원문을 하나라도 붙여넣어 주세요'); return; }
  const btn=$('genBtn'); btn.disabled=true; btn.innerHTML='<span class="spin">⏳</span> 생성 중... (10~20초)';
  try{
    let out=(await callAI(buildPrompt(a,b))).trim();
    if(out.length<1600){
      btn.innerHTML='<span class="spin">⏳</span> 짧아서 보강 중...';
      out=(await callAI(buildPrompt(a,b,`- 직전 시도가 ${out.length}자로 짧았다. 이번엔 반드시 1,700자 이상으로 더 풍부하게 쓸 것.`))).trim();
    }
    $('out').value=out; upOut();
    toast('✨ 생성 완료 ('+out.length.toLocaleString()+'자) — 수정 후 💾 저장!');
    $('out').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){ toast('⚠️ 생성 실패: '+e.message); }
  btn.disabled=false; btn.textContent='✨ 뉴 밴드글 생성 (1800자)';
}
window.addEventListener('DOMContentLoaded',loadAll);
</script>
</body>
</html>
