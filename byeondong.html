<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마찬 변동공지 신규 추출</title>
<!-- 구글 로그인 (읽기+쓰기: 마감시간 시트에 기록해야 해서 spreadsheets 스코프) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- 엑셀(원가 파일) 파싱용 SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans KR","Malgun Gothic",sans-serif; margin: 0; padding: 16px; color: #222; background: #fafafa; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #2d6a4f; }
  .sub { font-size: 12px; color: #888; margin-bottom: 12px; line-height: 1.5; }
  .card { background:#fff; border:1px solid #e3e3e3; border-radius:10px; padding:11px 13px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .step { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; background:#2d6a4f; color:#fff; border-radius:50%; font-size:12px; font-weight:700; margin-right:6px; }
  label { font-size: 13px; font-weight: 600; }
  input[type=text], input[type=number] { font-size: 14px; padding: 7px 9px; border: 1px solid #bbb; border-radius: 6px; font-family: inherit; }
  #clientId { flex: 1; min-width: 240px; }
  #startRow { width: 110px; }
  button { font-size: 14px; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; }
  #load { background: #2d6a4f; color: #fff; }
  #load:hover { background: #1f4d36; }
  .ghost { background: #eef2f0; color: #2d6a4f; border: 1px solid #cfe0d8; }
  .ghost:hover { background: #dfeae5; }
  .mini { font-size: 12px; color: #999; }
  #status, #wongaStatus { font-size: 13px; min-height: 18px; margin: 4px 2px; }
  .ok { color: #2d6a4f; } .warn { color: #c0392b; }
  table { border-collapse: collapse; background:#fff; border:1px solid #e3e3e3; font-size: 13px; white-space: nowrap; }
  th, td { padding: 7px 8px; border-bottom: 1px solid #eee; border-right:1px solid #f0f0f0; text-align: left; vertical-align: top; }
  th { background: #2d6a4f; color: #fff; font-size: 11.5px; position: sticky; top: 0; }
  th.new, td.new { background: #fff9ec; }
  th.new { background: #b45309; }
  td.spec { white-space: pre-wrap; max-width: 260px; color:#555; font-size:12px; }
  .sg-in { width: 92px; font-size: 13px; padding: 4px 6px; border:1px solid #b45309; border-radius:5px; font-weight:700; color:#b45309; }
  .byun-in { width: 88px; font-size: 13px; padding: 4px 6px; border:1px solid #999; border-radius:5px; }
  #applyBtn { border:none; border-radius:6px; padding:8px 15px; font-weight:700; cursor:pointer; }
  .actions { margin: 10px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #cfe0d8; border-top-color:#2d6a4f; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ovl { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:9999; }
  .ovbox { background:#fff; border-radius:10px; padding:16px; width:88%; max-width:520px; max-height:80vh; overflow:auto; }
  .ovtitle { font-size:15px; font-weight:700; color:#b45309; margin-bottom:10px; }
  .mgrow { display:flex; gap:8px; align-items:center; margin-bottom:7px; }
  .mgrow span { flex:1; font-size:13px; font-weight:600; }
  .mgrow input { width:150px; }
  details { margin-bottom:10px; }
  summary { cursor:pointer; font-size:13px; color:#2d6a4f; font-weight:600; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
  <h1>📦 마찬 변동공지 — 신규 추출</h1>
  <div class="sub">원가 파일을 넣고 → 시작행 불러오면, 공급가(원가+마진)·원공급가·마감시간까지 자동으로 채워옵니다.</div>

  <details id="cfg">
    <summary>⚙️ 설정 (최초 1회 — 구글 로그인 Client ID)</summary>
    <div class="card" style="margin-top:8px">
      <div class="row">
        <label for="clientId">Client ID</label>
        <input id="clientId" type="text" placeholder="...apps.googleusercontent.com">
        <button class="ghost" id="saveCfg">저장</button>
      </div>
    </div>
  </details>

  <!-- ① 원가 파일 -->
  <div class="card">
    <div class="row">
      <span><span class="step">1</span><label>원가 파일 선택</label></span>
      <input type="file" id="wongaFile" accept=".xlsx,.xls">
    </div>
    <div id="wongaStatus" class="mini">아직 원가 파일 없음 (선택하면 상품명→원가/현재판매가 준비)</div>
  </div>

  <!-- ② 시작행 불러오기 -->
  <div class="card">
    <div class="row">
      <span><span class="step">2</span><label for="startRow">시작 행</label></span>
      <input id="startRow" type="number" min="2" placeholder="예: 16612">
      <button id="load">🔍 불러오기</button>
      <span class="mini">비우면 처음부터(느림)·마지막 o 아래 자동</span>
    </div>
  </div>

  <div id="status"></div>

  <div class="actions" id="actions" style="display:none">
    <button id="applyBtn" style="background:#b45309;color:#fff">📥 변동사항 적용 (사본테스트)</button>
    <button class="ghost" id="copyBtn">📋 전체 복사</button>
    <span class="mini" id="copyHint"></span>
  </div>

  <div id="result" class="scroll"></div>

  <!-- ③ 마감시간 입력 팝업 -->
  <div id="mgov" class="ovl">
    <div class="ovbox">
      <div class="ovtitle">⏰ <span class="step" style="background:#b45309">3</span> 마감시간이 없는 상품 — 마감시간만 입력하세요</div>
      <div id="mglist"></div>
      <div style="text-align:right; margin-top:12px;">
        <button class="ghost" id="mgsave" style="background:#b45309;color:#fff;border:none">✔ 확인 (저장)</button>
        <button class="ghost" id="mgclose">닫기</button>
      </div>
    </div>
  </div>

<script>
  // ===== 고정 설정 =====
  var SPREADSHEET_ID = '1FZFCpwWdEzdLeXZQ5lvdUZjAtjAfn-uVwHnMccvXWzM';   // 마스터 외부유통
  var TAB = '[상품] 2. 변동공지';
  var MAGAM_ID = '1WrasAPb8uQLacnwOe2_vVZHD-3cQR7oYKLxOEB_k0SI';        // 수량 리더 시트
  var MAGAM_TAB = '마감시간';
  var APPLY_ID = '1GX04Eq_5Pr3ptbyXQpf0vAgVqmaOqMu-knvNy6af528';  // ★ 변동사항 적용 대상 = 연습용 사본테스트 (실전 전환 시 여기만 진짜 유통시트 id로 교체)
  var APPLY_TAB = '상품변동사항';
  var APPLY_GID = 548798859;                                       // 상품변동사항 탭 gid
  var SCOPE = 'https://www.googleapis.com/auth/spreadsheets';           // 읽기+쓰기
  var DEFAULT_CLIENT_ID = '337370860058-repde1q121dchas1fddan4tasikjep7l.apps.googleusercontent.com';
  var NAME_COL = 7, SYNC_COL = 18, WONGA_COL = 10, NUM_COLS = 19;       // 0-based: H상품명, S마찬, K원가
  var COLS = ['공급처','기재날짜','적용날짜','변동','상시/당일','유통기한','창고명변동','상품명변동','공급가변동','원공급가','원가','택배사','택배비변동','면과세변동','스펙변동/참고사항','마감시간'];
  var NEWCOLS = {8:1, 9:1, 10:1, 15:1};  // 새로 추가된(강조) 컬럼 인덱스

  var tokenClient = null, accessToken = null, tokenExp = 0, pending = null, LAST = null;
  var WRITE_OK = false, consentTried = false;   // 쓰기(수정) 권한 확보 여부
  var WONGA = {}, PRICE = {}, MAGAM = {}, MAGAM_LOADED = false;

  function pkey(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,'').trim(); }
  function num(s){ var n = parseInt(String(s==null?'':s).replace(/[^0-9]/g,''),10); return isNaN(n)?null:n; }
  function comma(n){ return (n==null)?'':Number(n).toLocaleString('ko-KR'); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function cell(arr, idx){ return (arr && arr.length>idx && arr[idx]!=null) ? String(arr[idx]).trim() : ''; }
  function setStatus(h,c){ var e=document.getElementById('status'); e.className=c||''; e.innerHTML=h; }
  function wongaStatus(h,c){ var e=document.getElementById('wongaStatus'); e.className=c||''; e.innerHTML=h; }
  function getClientId(){ return (localStorage.getItem('byd_clientId') || document.getElementById('clientId').value || DEFAULT_CLIENT_ID || '').trim(); }

  window.addEventListener('load', function(){
    document.getElementById('clientId').value = localStorage.getItem('byd_clientId') || DEFAULT_CLIENT_ID;
    var s = localStorage.getItem('byd_startRow'); if(s) document.getElementById('startRow').value = s;
  });
  document.getElementById('saveCfg').addEventListener('click', function(){
    localStorage.setItem('byd_clientId', document.getElementById('clientId').value.trim());
    setStatus('✅ Client ID 저장됨','ok'); document.getElementById('cfg').open=false; tokenClient=null;
  });

  // ===== ① 원가 파일 파싱 (SheetJS) =====
  document.getElementById('wongaFile').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    wongaStatus('<span class="spinner"></span> 원가 파일 읽는 중...');
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
        WONGA = {}; PRICE = {};
        for (var i=1;i<rows.length;i++){
          var r = rows[i]; if(!r) continue;
          var nm = String(r[0]!=null?r[0]:'').trim(); if(!nm) continue;
          var k = pkey(nm);
          var w = String(r[4]!=null?r[4]:'').trim();   // E 원가
          var p = String(r[1]!=null?r[1]:'').trim();   // B 공급가(현재판매가)
          if(w!=='') WONGA[k]=w;
          if(p!=='') PRICE[k]=p;
        }
        wongaStatus('✅ 원가 <b>'+Object.keys(WONGA).length+'</b>개 로드됨 ('+esc(f.name)+')','ok');
      } catch(err){ wongaStatus('⚠️ 원가 파일 읽기 실패: '+esc(err.message),'warn'); }
    };
    reader.readAsArrayBuffer(f);
  });

  // ===== 구글 로그인 =====
  function ensureClient(){
    if(tokenClient) return true;
    if(!(window.google && google.accounts && google.accounts.oauth2)) return false;
    var cid = getClientId(); if(!cid) return false;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: SCOPE,
      callback: function(resp){
        if(resp && resp.access_token){
          var okScope = (typeof google.accounts.oauth2.hasGrantedAllScopes!=='function') || google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE);
          if(!okScope && !consentTried){ consentTried=true; setStatus('✍️ 시트에 쓰려면 "수정" 권한이 필요해요 — 뜨는 창에서 허용해주세요...','warn'); tokenClient.requestAccessToken({prompt:'consent'}); return; }
          accessToken = resp.access_token; WRITE_OK = okScope;
          tokenExp = Date.now() + ((resp.expires_in?resp.expires_in:3300)*1000);
          var a=pending; pending=null; if(a) a();
        } else { setStatus('⚠️ 로그인 취소/실패'+(resp&&resp.error?(' ('+resp.error+')'):''),'warn'); }
      }
    });
    return true;
  }
  function withToken(action){
    if(accessToken && Date.now() < tokenExp-60000 && WRITE_OK){ action(); return; }
    if(!ensureClient()){ setStatus('⚠️ 구글 라이브러리 로딩중이거나 Client ID 미설정','warn'); document.getElementById('cfg').open=true; return; }
    pending = action; tokenClient.requestAccessToken({prompt:''});
  }

  // ===== Sheets API 읽기 =====
  function readRange(sheetId, range){
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+'?majorDimension=ROWS';
    return fetch(url, { headers:{ Authorization:'Bearer '+accessToken } }).then(function(r){
      if(r.status===401||r.status===403) throw new Error('권한 오류('+r.status+') — 시트 접근/수정권한, 재로그인 확인');
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json().then(function(j){ return j.values||[]; });
    });
  }
  // ===== Sheets API 쓰기(append) — 마감시간 시트 맨 아래 =====
  function appendMagam(name, time){
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/'+MAGAM_ID+'/values/'+encodeURIComponent("'"+MAGAM_TAB+"'!A:J")+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
    var body = { values: [[ '', name, '', '', '', '', '', '', '', time ]] };  // B=상품명, J=마감시간
    return fetch(url, { method:'POST', headers:{ Authorization:'Bearer '+accessToken, 'Content-Type':'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw new Error('마감시간 저장 실패 HTTP '+r.status); return true; });
  }

  document.getElementById('load').addEventListener('click', function(){ withToken(doFetch); });
  document.getElementById('startRow').addEventListener('keydown', function(e){ if(e.key==='Enter') withToken(doFetch); });

  function doFetch(){
    var start = parseInt(document.getElementById('startRow').value,10);
    localStorage.setItem('byd_startRow', document.getElementById('startRow').value||'');
    var hasStart = !(isNaN(start)||start<2);
    var dataRange = "'"+TAB+"'!A"+(hasStart?start:2)+":S";
    var offset = hasStart?start:2;
    if(Object.keys(WONGA).length===0) wongaStatus('⚠️ 원가 파일을 아직 안 넣었어요 — 원가/공급가 칸이 비어요 (①번 먼저)','warn');
    setStatus('<span class="spinner"></span> 시트 읽는 중...');
    document.getElementById('actions').style.display='none';
    document.getElementById('result').innerHTML='';

    var pSrc = readRange(SPREADSHEET_ID, dataRange);
    var pMag = MAGAM_LOADED ? Promise.resolve(null) : readRange(MAGAM_ID, "'"+MAGAM_TAB+"'!A2:J").then(function(v){
      MAGAM={}; v.forEach(function(r){ var nm=cell(r,1); if(nm) MAGAM[pkey(nm)] = cell(r,9); }); MAGAM_LOADED=true; return null;
    });
    Promise.all([pSrc, pMag]).then(function(res){ render(res[0], offset, hasStart, start); })
      .catch(function(e){ setStatus('⚠️ '+e.message,'warn'); });
  }

  function render(values, offset, hasStart, start){
    var floor;
    if(hasStart){ floor=start; }
    else { var lastO=1; for(var k0=0;k0<values.length;k0++){ if(cell(values[k0],SYNC_COL)!=='') lastO=offset+k0; } floor=lastO+1; }

    var rows=[];
    for(var k=0;k<values.length;k++){
      var v=values[k], sheetRow=offset+k;
      if(sheetRow<floor) continue;
      var name=cell(v,NAME_COL), sync=cell(v,SYNC_COL);
      if(name==='' || sync!=='') continue;
      var pk=pkey(name);
      // 원가(표시·판단용): 변동공지 K열 우선, 없으면 원가파일
      var wongaRaw = cell(v,WONGA_COL); var wnum = num(wongaRaw);
      if(wnum==null){ wnum = num(WONGA[pk]); }
      // 공급가변동 = 변동공지 공급가변동(I열=idx8) + 마진. "A > B"면 뒤(새 값) 사용. 만원↑+1000 / 만원↓+500 (I값 기준)
      var gongRaw = cell(v,8); var gparts = gongRaw.split('>'); var gnum = num(gparts[gparts.length-1]);
      var supply='';
      if(gnum!=null){ supply = comma(gnum + (gnum>=10000?1000:500)); }
      var wonPrice = PRICE[pk] || '';           // 원공급가(현재판매가)
      var magam = MAGAM[pk] || '';
      var spec = [cell(v,13), cell(v,14)].filter(function(x){return x!=='';}).join('\n');
      rows.push({
        pk:pk, disp:name,
        c:[ cell(v,0), cell(v,1), cell(v,2), cell(v,3), cell(v,4), cell(v,5), cell(v,6), name,
            supply, wonPrice, (wnum!=null?comma(wnum):''), cell(v,9), cell(v,11), cell(v,12), spec, magam ]
      });
    }
    LAST=rows;

    var lastSheetRow = offset+values.length-1;
    setStatus('✅ <b>'+rows.length+'건</b> 발견 · 기준 시작행 '+floor+' · 읽은 마지막행 '+lastSheetRow, 'ok');
    if(rows.length===0){ document.getElementById('result').innerHTML='<div style="padding:20px;color:#888">신규 변동이 없어요. 시작 행을 위로 낮춰보세요.</div>'; return; }

    var h='<table id="qtytable"><thead><tr>';
    for(var i=0;i<COLS.length;i++) h+='<th class="'+(NEWCOLS[i]?'new':'')+'">'+esc(COLS[i])+'</th>';
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr data-k="'+esc(r.pk)+'">';
      for(var i=0;i<r.c.length;i++){
        var cls = NEWCOLS[i]?'new':''; if(i===14) cls+=' spec';
        if(i===3){ // 변동 = 수정 가능 (재입고+인상 등 여러 변동 합치기)
          h+='<td class="'+cls+'"><input class="byun-in" value="'+esc(r.c[3])+'"></td>';
        } else if(i===8){ // 공급가변동 = 수정 가능 입력칸
          h+='<td class="'+cls+'"><input class="sg-in" value="'+esc(r.c[8])+'"></td>';
        } else if(i===15){ // 마감시간
          h+='<td class="'+cls+' magam" data-k="'+esc(r.pk)+'">'+esc(r.c[15])+'</td>';
        } else {
          h+='<td class="'+cls+'">'+esc(r.c[i])+'</td>';
        }
      }
      h+='</tr>';
    });
    h+='</tbody></table>';
    document.getElementById('result').innerHTML=h;
    document.getElementById('actions').style.display='flex';
    document.getElementById('copyHint').textContent='('+COLS.length+'칸 · 공급가 칸 직접 수정 가능)';

    // 마감시간 없는 상품 → 팝업
    var missing = rows.filter(function(r){ return !r.c[15]; });
    if(missing.length){ openMagamPopup(missing); }
  }

  // ===== 마감시간 팝업 =====
  function openMagamPopup(missing){
    var seen={}, uniq=[];
    missing.forEach(function(r){ if(!seen[r.pk]){ seen[r.pk]=1; uniq.push(r); } });
    var html='';
    uniq.forEach(function(r){
      html+='<div class="mgrow"><span>'+esc(r.disp)+'</span><input type="text" data-k="'+esc(r.pk)+'" data-name="'+esc(r.disp)+'" placeholder="예: 연장마감 : 16시"></div>';
    });
    document.getElementById('mglist').innerHTML=html;
    document.getElementById('mgov').style.display='flex';
  }
  document.getElementById('mgclose').addEventListener('click', function(){ document.getElementById('mgov').style.display='none'; });
  document.getElementById('mgsave').addEventListener('click', function(){
    var inputs = document.querySelectorAll('#mglist input');
    var jobs=[]; var btn=this;
    for(var i=0;i<inputs.length;i++){
      var val=inputs[i].value.trim();
      if(val!==''){ jobs.push({ pk:inputs[i].getAttribute('data-k'), name:inputs[i].getAttribute('data-name'), time:val }); }
    }
    if(jobs.length===0){ alert('입력한 마감시간이 없어요.'); return; }
    btn.disabled=true; var o=btn.innerHTML; btn.innerHTML='저장중...';
    // 순차 저장
    var idx=0;
    function next(){
      if(idx>=jobs.length){
        btn.disabled=false; btn.innerHTML=o;
        document.getElementById('mgov').style.display='none';
        setStatus('✅ 마감시간 '+jobs.length+'건 저장 완료 (마감시간 시트 + 표 반영)','ok');
        return;
      }
      var j=jobs[idx];
      appendMagam(j.name, j.time).then(function(){
        MAGAM[j.pk]=j.time;
        var cells=document.querySelectorAll('td.magam[data-k="'+cssq(j.pk)+'"]');
        for(var m=0;m<cells.length;m++) cells[m].textContent=j.time;
        idx++; next();
      }).catch(function(e){ alert('저장 실패('+j.name+'): '+e.message); btn.disabled=false; btn.innerHTML=o; });
    }
    withToken(function(){ next(); });   // 쓰기 토큰 확보 후 저장
  });
  function cssq(s){ return String(s).replace(/["\\]/g,'\\$&'); }

  // ===== 변동사항 적용 — 사본테스트 상품변동사항 5행에 끼워넣기 =====
  function batchInsertRows(sheetId, gid, startRow0, count){
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+':batchUpdate';
    var body = { requests: [
      { insertDimension: { range: { sheetId: gid, dimension:'ROWS', startIndex:startRow0, endIndex:startRow0+count }, inheritFromBefore:false } },
      { repeatCell: {   // 끼운 행 A~M 가운데 정렬 + 폰트 12
        range: { sheetId: gid, startRowIndex:startRow0, endRowIndex:startRow0+count, startColumnIndex:0, endColumnIndex:13 },
        cell: { userEnteredFormat: { horizontalAlignment:'CENTER', verticalAlignment:'MIDDLE', textFormat:{ fontSize:12 } } },
        fields: 'userEnteredFormat(horizontalAlignment,verticalAlignment,textFormat.fontSize)'
      } }
    ] };
    return fetch(url, {method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw new Error('행 삽입 실패 HTTP '+r.status); return true; });
  }
  function writeRows(sheetId, tab, startRow1, rows){
    var url='https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent("'"+tab+"'!A"+startRow1)+'?valueInputOption=USER_ENTERED';
    return fetch(url, {method:'PUT', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}, body:JSON.stringify({values:rows})})
      .then(function(r){ if(!r.ok) throw new Error('값 기록 실패 HTTP '+r.status); return true; });
  }
  document.getElementById('applyBtn').addEventListener('click', function(){
    var tbl=document.getElementById('qtytable'); if(!tbl){ alert('먼저 불러오기 하세요.'); return; }
    var trs=tbl.tBodies[0].querySelectorAll('tr'); if(!trs.length){ alert('적용할 데이터가 없어요.'); return; }
    function norm(s){ return String(s||'').replace(/[^0-9]/g,''); }
    var rows=[];
    for(var r=0;r<trs.length;r++){
      var tds=trs[r].children;
      var txt=function(i){ var inp=tds[i]?tds[i].querySelector('input'):null; return inp?inp.value:(tds[i]?tds[i].textContent:''); };
      var won=txt(9), sae=txt(8);   // 원공급가 / 새 공급가
      var gong=(won && norm(won)!=='' && norm(won)!==norm(sae)) ? (won+' > '+sae) : sae;  // 변동있으면 a>b
      // A~M 13칸: 공급처,기재,적용,변동,상시당일,유통,창고명,상품명,공급가변동,택배사,택배비,면과세,스펙/참고
      rows.push([ txt(0),txt(1),txt(2),txt(3),txt(4),txt(5),txt(6),txt(7), gong, txt(11),txt(12),txt(13),txt(14) ]);
    }
    if(!confirm(rows.length+'건을 [사본테스트] 상품변동사항 5행에 끼워넣을까요?\n(기존 내용은 아래로 밀립니다)')) return;
    var btn=this; btn.disabled=true; var o=btn.innerHTML; btn.innerHTML='적용중...';
    withToken(function(){
      batchInsertRows(APPLY_ID, APPLY_GID, 4, rows.length)   // startIndex 4 = 5행
        .then(function(){ return writeRows(APPLY_ID, APPLY_TAB, 5, rows); })
        .then(function(){ btn.disabled=false; btn.innerHTML=o; setStatus('✅ '+rows.length+'건 [사본테스트] 상품변동사항 5행에 적용 완료!','ok'); alert('적용 완료! 사본테스트 시트를 확인해보세요.'); })
        .catch(function(e){ btn.disabled=false; btn.innerHTML=o; setStatus('⚠️ 적용 실패: '+e.message,'warn'); alert('적용 실패: '+e.message); });
    });
  });

  // ===== 전체 복사 (화면 표 그대로, 공급가 수정값 포함) =====
  document.getElementById('copyBtn').addEventListener('click', function(){
    var tbl=document.getElementById('qtytable'); if(!tbl) return;
    var lines=[];
    var trs=tbl.tBodies[0].querySelectorAll('tr');
    for(var r=0;r<trs.length;r++){
      var tds=trs[r].children, arr=[];
      for(var c=0;c<tds.length;c++){
        var inp=tds[c].querySelector('input');
        var t = inp ? inp.value : tds[c].textContent;
        arr.push(String(t==null?'':t).replace(/\t/g,' ').replace(/\n/g,' '));
      }
      lines.push(arr.join('\t'));
    }
    var tsv=lines.join('\n');
    var btn=this, ok=false;
    try{ var ta=document.createElement('textarea'); ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); ok=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){ ok=false; }
    var o=btn.innerHTML; btn.innerHTML=ok?'✓ 복사됨':'복사 실패'; setTimeout(function(){ btn.innerHTML=o; },1500);
  });
</script>
