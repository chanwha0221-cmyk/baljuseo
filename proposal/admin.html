<!DOCTYPE html>

<head>

  <meta name="robots" content="noindex">

  <meta http-equiv="Pragma" content="no-cache">
  <link rel="preconnect" href="https://fonts.googleapis.com">

       ?v=날짜 방식은 admin.html 자체가 캐시되면 무용지물이라 실제로 당했다. 되돌리지 말 것. -->
  <script src="../sheets-proxy.js"></script>
<script>window.__CB = Date.now();
    document.write('<link rel="stylesheet" href="assets/admin.css?t=' + window.__CB + '">');</script>
</head>

  <!-- 팀장님 전용 — 로그인 없음(주소를 아는 사람만 들어온다, noindex).

       데이터: 도구시트의 제안서버전 / 제안서카테고리 / 제안서상품 / 제안이력 탭. -->

  </div>

    document.write('<scr' + 'ipt src="assets/svc.js?t=' + window.__CB + '"><\/scr' + 'ipt>');
    document.write('<scr' + 'ipt src="assets/admin.js?t=' + window.__CB + '"><\/scr' + 'ipt>');
