<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>외부 업체 등록 도구 v3.4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg:#f5f4f0;--surface:#ffffff;--surface2:#f0ede8;--border:#e0dbd4;--border2:#ccc8c0;
  --text:#1a1816;--text2:#6b6760;--text3:#a8a49e;
  --accent:#2d6a4f;--accent-light:#e8f4ee;--accent-hover:#1e4d38;
  --warn:#b45309;--warn-bg:#fef3c7;--ok:#2d6a4f;--ok-bg:#e8f4ee;
  --out-bg:#f8fffe;--out-text:#1a4a35;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{font-size:15px;font-weight:700;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.ver{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);background:var(--accent-light);border:1px solid #b7ddc8;padding:2px 7px;border-radius:20px;font-weight:500}
.subtitle{margin-left:auto;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.main{flex:1;display:flex;flex-direction:column;padding:14px 18px;gap:12px;max-width:1400px;width:100%;margin:0 auto}
.flow{padding:8px 12px;background:var(--accent-light);border:1px solid #b7ddc8;border-radius:6px;font-size:11px;color:var(--accent);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow b{font-weight:700}
.flow .arrow{color:#7fb99d}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.workspace{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.panel-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:8px}
.panel-body textarea{width:100%;border:1px solid var(--border2);border-radius:5px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;resize:vertical;color:var(--text);background:var(--surface);outline:none;min-height:170px}
.panel-body textarea:focus{border-color:var(--accent)}
.parse-status{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;text-align:right;min-height:16px}
.parse-status.ok{color:var(--ok)}
.parse-status.warn{color:var(--warn)}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr)}}
.form-grid .span2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;font-weight:500;color:var(--text2);display:flex;justify-content:space-between;gap:6px}
.field input{padding:8px 10px;border:1px solid var(--border2);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);background:var(--surface);outline:none;transition:border .1s}
.field input:focus{border-color:var(--accent)}
.field select{padding:8px 10px;border:1px solid var(--border2);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);background:var(--surface);outline:none}
.field select:focus{border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;padding:0;flex:none}
.chk b{color:var(--accent)}
.field.parsed input,.field.parsed select{background:#f5fbf7;border-color:#b7ddc8}
.bizno-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700}
.bizno-badge.ok{color:var(--ok)}
.bizno-badge.warn{color:var(--warn)}
details.extra{border:1px dashed var(--border2);border-radius:6px;padding:8px 12px}
details.extra summary{cursor:pointer;font-size:11px;color:var(--text3);font-weight:700;user-select:none}
details.extra .form-grid{margin-top:10px}
.output-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
#tsvOutput{width:100%;border:1px solid var(--border2);border-radius:5px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;resize:none;color:var(--out-text);background:var(--out-bg);min-height:50px;outline:none;white-space:pre;overflow-x:auto}
.preview-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;display:none}
.preview-wrap.show{display:block}
.preview-wrap table{border-collapse:collapse;font-size:11px;white-space:nowrap}
.preview-wrap th{background:var(--surface2);color:var(--text3);font-weight:700;padding:5px 10px;border:1px solid var(--border);font-size:10px}
.preview-wrap td{padding:5px 10px;border:1px solid var(--border);font-family:'JetBrains Mono',monospace}
.preview-wrap td.empty{color:var(--text3);background:#fafaf8}
.bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .1s}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;padding:10px 26px;font-size:13px}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.copy-btn{color:var(--accent);border-color:#b7ddc8;background:var(--accent-light)}
.btn.copy-btn:hover{background:#d4ecdf}
.btn.mini{padding:2px 8px;font-size:10px;border-radius:4px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:400px;animation:fadeIn .15s;line-height:1.5;white-space:pre-line}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <span class="logo">외부 업체 <span>등록 도구</span></span>
  <span class="ver">v3.4 통합등록</span>
  <span class="subtitle">사업자등록증 + 업체자료 조합 → 리모컨 붙여넣기</span>
</header>
<div class="main">
  <div class="flow">
    <b>① 사업자등록증 사본 → 하비서한테 전달</b><span class="arrow">▶</span>
    <b>② 하비서가 뽑아준 정보를 왼쪽 칸에</b><span class="arrow">▶</span>
    <b>③ 업체 회신 자료를 오른쪽 칸에</b><span class="arrow">▶</span>
    <b>④ [조합] 클릭 = 복사까지 완료 → 리모컨에 Ctrl+V</b>
  </div>

  <div class="workspace">
    <!-- ① 사업자등록증 정보 -->
    <div class="panel">
      <div class="panel-head">① 사업자등록증 정보 (하비서가 뽑아준 것 붙여넣기)</div>
      <div class="panel-body">
        <textarea id="certBox" placeholder="예시 (하비서 출력 그대로):&#10;사업자명: 주식회사 필름&#10;사업자번호: 123-45-67890&#10;대표자: 이윤석&#10;사업장주소: 서울시 강남구 …&#10;업태: 도매 및 소매업&#10;종목: 식품"></textarea>
        <div class="parse-status" id="certStatus">붙여넣으면 자동 파싱</div>
      </div>
    </div>

    <!-- ② 업체 회신 자료 -->
    <div class="panel">
      <div class="panel-head">② 업체 회신 자료 (받은 그대로 붙여넣기)</div>
      <div class="panel-body">
        <textarea id="vendorBox" placeholder="예시 (받은 그대로 OK · 자동 파싱):&#10;업체명 : 필름&#10;담당자 : 이윤석&#10;아이디 : dldbstjr76&#10;연락처 : 010-3794-6086&#10;이메일 : dldbstjr7676@gmail.com&#10;계산서 발행할 이메일 주소 : tax@film.co.kr  (선택)"></textarea>
        <div class="parse-status" id="vendorStatus">붙여넣으면 자동 파싱</div>
      </div>
    </div>
  </div>

  <!-- 파싱 결과 폼 -->
  <div class="form-section">
    <div class="section-title">파싱 결과 (직접 수정 가능)</div>
    <div class="form-grid">
      <div class="field" id="field-chName"><label>외부채널명</label><input type="text" id="chName"></div>
      <div class="field" id="field-chAlias"><label>외부채널별칭</label><input type="text" id="chAlias"></div>
      <div class="field" id="field-bizName"><label>사업자명 (상호)</label><input type="text" id="bizName"></div>
      <div class="field" id="field-bizNo"><label>사업자번호 <span class="bizno-badge" id="biznoBadge"></span></label><input type="text" id="bizNo" placeholder="000-00-00000"></div>
      <div class="field" id="field-active"><label>활성여부 <span style="color:var(--text3)">자동</span></label><label class="chk"><input type="checkbox" id="active" checked><b>TRUE</b> (체크 = 활성)</label></div>
      <div class="field" id="field-cycle"><label>정산주기 <span style="color:var(--text3)">기본 일정산</span></label><select id="cycle"><option value="일정산" selected>일정산</option><option value="주정산">주정산</option><option value="월정산">월정산</option></select></div>
      <div class="field" id="field-rep"><label>대표자</label><input type="text" id="rep"></div>
      <div class="field span2" id="field-addr"><label>사업장주소</label><input type="text" id="addr"></div>
      <div class="field" id="field-uptae"><label>업태</label><input type="text" id="uptae"></div>
      <div class="field" id="field-jongmok"><label>종목</label><input type="text" id="jongmok"></div>
      <div class="field" id="field-mgr1"><label>담당자</label><input type="text" id="mgr1"></div>
      <div class="field" id="field-tel1"><label>연락처</label><input type="text" id="tel1"></div>
      <div class="field" id="field-mail1"><label>이메일(시트)</label><input type="text" id="mail1"></div>
      <div class="field" id="field-uid1"><label>가입아이디</label><input type="text" id="uid1"></div>
      <div class="field" id="field-taxMail"><label>이메일(계산서) <button class="btn mini" id="sameMailBtn" title="시트 이메일과 동일하게">시트와 동일</button></label><input type="text" id="taxMail"></div>
      <div class="field" id="field-memo"><label>메모</label><input type="text" id="memo"></div>
    </div>
    <details class="extra">
      <summary>담당자 2 · 3 (필요할 때만 펼치기)</summary>
      <div class="form-grid">
        <div class="field" id="field-mgr2"><label>담당자2</label><input type="text" id="mgr2"></div>
        <div class="field" id="field-tel2"><label>연락처2</label><input type="text" id="tel2"></div>
        <div class="field" id="field-mail2"><label>이메일(시트)2</label><input type="text" id="mail2"></div>
        <div class="field" id="field-uid2"><label>가입아이디2</label><input type="text" id="uid2"></div>
        <div class="field" id="field-mgr3"><label>담당자3</label><input type="text" id="mgr3"></div>
        <div class="field" id="field-tel3"><label>연락처3</label><input type="text" id="tel3"></div>
        <div class="field" id="field-mail3"><label>이메일(시트)3</label><input type="text" id="mail3"></div>
        <div class="field" id="field-uid3"><label>가입아이디3</label><input type="text" id="uid3"></div>
      </div>
    </details>
  </div>

  <!-- 출력 -->
  <div class="output-section">
    <div class="bottom">
      <button class="btn primary" id="combineBtn">⚡ 조합 (생성 + 복사)</button>
      <button class="btn copy-btn" id="copyBtn">복사만 다시</button>
      <button class="btn" id="clearBtn">초기화</button>
      <span style="font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace">리모컨 붙여넣기용 24칸 한 줄 (활성여부 포함)</span>
    </div>
    <textarea id="tsvOutput" readonly placeholder="[조합] 누르면 리모컨에 붙여넣을 한 줄이 생기고, 클립보드에 자동 복사됩니다."></textarea>
    <div class="preview-wrap" id="previewWrap">
      <table>
        <thead><tr id="previewHead"></tr></thead>
        <tbody><tr id="previewRow"></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// 리모컨 컬럼 순서 (2026-08-11 v3.1: 사업자번호 뒤 활성여부 체크박스 칸 복구 = 24칸)
// ⚠️ 활성여부는 헤더엔 안 보여도 그리드가 체크박스 칸을 한 칸 소비함 — 빼면 뒤 칸 전부 한 칸씩 밀림 (v1.9·v3.0 두 번 같은 사고)
const COLS = [
  ['외부채널명','chName'],['사업자명','bizName'],['외부채널별칭','chAlias'],['사업자번호','bizNo'],
  ['활성여부','active'],['정산주기','cycle'],['담당자','mgr1'],['연락처','tel1'],['이메일(시트)','mail1'],['가입아이디','uid1'],
  ['담당자2','mgr2'],['연락처2','tel2'],['이메일(시트)2','mail2'],['가입아이디2','uid2'],
  ['담당자3','mgr3'],['연락처3','tel3'],['이메일(시트)3','mail3'],['가입아이디3','uid3'],
  ['대표자','rep'],['사업장주소','addr'],['업태','uptae'],['종목','jongmok'],
  ['이메일(계산서)','taxMail'],['메모','memo']
];

function g(id){
  const el = document.getElementById(id);
  if (el.type === 'checkbox') return el.checked ? 'TRUE' : 'FALSE';
  return el.value.trim();
}
function setField(id, val){
  const el = document.getElementById(id);
  if (el.tagName === 'SELECT' && !Array.from(el.options).some(o => o.value === val)) {
    el.appendChild(new Option(val, val));   // 파싱값이 목록에 없으면 그 값을 옵션으로 추가
  }
  el.value = val;
  const wrap = document.getElementById('field-' + id);
  if (wrap) wrap.classList.add('parsed');
}

// ========== 사업자번호 체크섬 (국세청 검증식) ==========
function validBizNo(v){
  const d = (v || '').replace(/[^0-9]/g, '');
  if (d.length !== 10) return null;
  const w = [1,3,7,1,3,7,1,3,5];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += parseInt(d[i]) * w[i];
  sum += Math.floor(parseInt(d[8]) * 5 / 10);
  return (10 - sum % 10) % 10 === parseInt(d[9]);
}
function updateBiznoBadge(){
  const badge = document.getElementById('biznoBadge');
  const ok = validBizNo(g('bizNo'));
  if (ok === null) { badge.textContent = ''; badge.className = 'bizno-badge'; return; }
  if (ok) { badge.textContent = '✓ 검증통과'; badge.className = 'bizno-badge ok'; }
  else { badge.textContent = '⚠️ 체크섬 불일치 — 숫자 확인!'; badge.className = 'bizno-badge warn'; }
}
document.getElementById('bizNo').addEventListener('input', updateBiznoBadge);

function fmtBizNo(v){
  const m = (v || '').match(/(\d{3})\s*[-\.\s]?\s*(\d{2})\s*[-\.\s]?\s*(\d{5})/);
  return m ? m[1] + '-' + m[2] + '-' + m[3] : v;
}

// ========== 이메일 오타 보정 ==========
const EMAIL_DOMAIN_FIX = {
  'gmal.com':'gmail.com','gmial.com':'gmail.com','gmaill.com':'gmail.com',
  'gnail.com':'gmail.com','gamil.com':'gmail.com','gmali.com':'gmail.com',
  'gmaim.com':'gmail.com','gmsil.com':'gmail.com','gmaul.com':'gmail.com',
  'gemail.com':'gmail.com','gmaio.com':'gmail.com','gmeil.com':'gmail.com',
  'gmail.con':'gmail.com','gmail.cm':'gmail.com','gmail.co':'gmail.com',
  'gmail.cmo':'gmail.com','gmail.kr':'gmail.com','gmail.coom':'gmail.com',
  'gmail.comm':'gmail.com','gmail.cim':'gmail.com',
  'naver.con':'naver.com','naver.cm':'naver.com','naver.co':'naver.com',
  'nver.com':'naver.com','navwer.com':'naver.com','naber.com':'naver.com',
  'navrer.com':'naver.com','naveer.com':'naver.com','nayer.com':'naver.com',
  'navr.com':'naver.com','naver.coom':'naver.com','navet.com':'naver.com',
  'daum.com':'daum.net','daum.cm':'daum.net','daum.con':'daum.net',
  'daum.ne':'daum.net','daun.net':'daum.net','dam.net':'daum.net',
  'daum.nt':'daum.net','daum.nett':'daum.net',
  'hanmail.com':'hanmail.net','hamail.net':'hanmail.net','hanmail.ne':'hanmail.net',
  'hanmaii.net':'hanmail.net','hannmail.net':'hanmail.net','hanmsil.net':'hanmail.net',
  'kakao.con':'kakao.com','kako.com':'kakao.com','kakoa.com':'kakao.com',
  'kkakao.com':'kakao.com','kakao.cm':'kakao.com',
  'nate.con':'nate.com','nate.cm':'nate.com','nat.com':'nate.com','naye.com':'nate.com',
  'hotmail.con':'hotmail.com','hotmial.com':'hotmail.com','hormail.com':'hotmail.com',
  'yahoo.con':'yahoo.com','yahooo.com':'yahoo.com','yaho.com':'yahoo.com',
  'outlook.con':'outlook.com','outlok.com':'outlook.com'
};
let emailFixNote = '';
function fixEmailTypos(email){
  emailFixNote = '';
  if (!email || !email.includes('@')) return email;
  const parts = email.split('@');
  if (parts.length !== 2) return email;
  const local = parts[0].trim();
  const domain = parts[1].trim().toLowerCase();
  if (EMAIL_DOMAIN_FIX[domain]) {
    emailFixNote = domain + ' → ' + EMAIL_DOMAIN_FIX[domain];
    return local + '@' + EMAIL_DOMAIN_FIX[domain];
  }
  return local + '@' + domain;
}

function formatPhone(n){
  if (!n) return '';
  if (n.length === 11) return n.slice(0,3) + '-' + n.slice(3,7) + '-' + n.slice(7);
  if (n.length === 10) {
    if (n.startsWith('02')) return n.slice(0,2) + '-' + n.slice(2,6) + '-' + n.slice(6);
    return n.slice(0,3) + '-' + n.slice(3,6) + '-' + n.slice(6);
  }
  if (n.length === 9 && n.startsWith('02')) return n.slice(0,2) + '-' + n.slice(2,5) + '-' + n.slice(5);
  if (n.length === 8 && n.startsWith('1')) return n.slice(0,4) + '-' + n.slice(4);
  if (n.length === 12 && n.startsWith('050')) return n.slice(0,4) + '-' + n.slice(4,8) + '-' + n.slice(8);
  return n;
}

// ========== ① 사업자등록증 칸 파싱 (하비서 표준 출력: "라벨: 값" 줄) ==========
const CERT_PATTERNS = [
  ['bizName', /(?:사업자명|법인명|상호명|상호)/],
  ['bizNo',   /(?:사업자\s*등록\s*번호|사업자\s*번호|등록\s*번호)/],
  ['rep',     /(?:대표자명|대표자|대표)/],
  ['addr',    /(?:사업장\s*주소|사업장\s*소재지|소재지|주소)/],
  ['uptae',   /(?:업태)/],
  ['jongmok', /(?:종목)/]
];
function parseCertBox(){
  const text = document.getElementById('certBox').value;
  const status = document.getElementById('certStatus');
  if (!text.trim()) { status.textContent = '붙여넣으면 자동 파싱'; status.className = 'parse-status'; return; }
  let filled = 0;
  for (const line of text.split('\n')) {
    const t = line.trim().replace(/^[-•*·\s]+/, '');
    if (!t) continue;
    for (const [field, kw] of CERT_PATTERNS) {
      const m = t.match(new RegExp('^' + kw.source + '\\s*[:：=\\-]\\s*(.+)$'));
      if (!m) continue;
      let v = m[1].trim();
      if (field === 'bizNo') v = fmtBizNo(v);
      setField(field, v);
      filled++;
      break;
    }
  }
  // 라벨 없이 번호만 굴러다녀도 줍기
  if (!g('bizNo')) {
    const m = text.match(/(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})/);
    if (m) { setField('bizNo', m[1] + '-' + m[2] + '-' + m[3]); filled++; }
  }
  updateBiznoBadge();
  if (filled) { status.textContent = '✅ ' + filled + '개 필드 인식'; status.className = 'parse-status ok'; }
  else { status.textContent = '⚠️ 인식된 라벨 없음 — "사업자명: 값" 형식인지 확인'; status.className = 'parse-status warn'; }
}

// ========== ② 업체 회신 칸 파싱 (자유 형식) ==========
const VENDOR_PATTERNS = [
  ['chAlias', /(?:별칭|채널\s*별칭)/],
  // 계산서 관련 줄은 문구가 제각각("계산서 발행할 이메일 주소", "세금계산서 받으실 메일" 등)
  // → 라벨은 '계산서' 한 단어로만 잡고, 값에 이메일이 있을 때만 채운다(아래 taxMail 가드)
  ['taxMail', /(?:세금\s*)?계산서/i],
  ['cycle',   /(?:정산\s*주기|정산)/],
  ['memo',    /(?:메모|비고|특이사항)/],
  ['chName',  /(?:업체명|사업자명|상호명|상호|회사명|회사|채널명)/],
  ['tel1',    /(?:연락처\s*번호|연락처|전화\s*번호|핸드폰\s*번호|휴대폰\s*번호|핸드폰|휴대폰|전화|폰)/],
  ['mgr1',    /(?:담당자명|담당자|대표자명|대표자|대표명|사장님|사장|대표)/],
  ['bizNo2',  /(?:사업자\s*등록\s*번호|사업자\s*번호|등록\s*번호)/],
  ['uid1',    /(?:가입\s*아이디|가입\s*ID|아이디|ID)/i],
  ['mail1',   /(?:이\s*메일\s*주소|이\s*메일|이메일|메일|email|e-mail|mail|주소)/i]
];
function parseVendorBox(){
  const text = document.getElementById('vendorBox').value;
  const status = document.getElementById('vendorStatus');
  if (!text.trim()) { status.textContent = '붙여넣으면 자동 파싱'; status.className = 'parse-status'; return; }
  const lines = text.split('\n');
  const usedLines = new Set();
  const got = {};
  let fixNote = '';
  for (let li = 0; li < lines.length; li++) {
    const t = lines[li].trim();
    if (!t) continue;
    for (const [field, kw] of VENDOR_PATTERNS) {
      if (got[field]) continue;
      let m = t.match(new RegExp('^\\s*(?:.*?)' + kw.source + '\\s*[:：=>\\-]+\\s*(.+)$', kw.flags));
      if (!m) m = t.match(new RegExp('^\\s*(?:.*?)' + kw.source + '\\s+(.+)$', kw.flags));
      if (!m) continue;
      let v = (m[1] || '').trim().replace(/^[:：=>\-\s]+/, '').trim();
      if (!v) continue;
      if (field === 'mail1' || field === 'taxMail') {
        const md = v.match(/\[([^\]]+)\]/);
        if (md) v = md[1];
        v = v.replace(/^mailto:/i, '').trim();
        const em = v.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
        if (em) v = em[0];
        else if (field === 'taxMail') { if (/동일|같/.test(v)) v = '__SAME__'; else continue; } // 이메일 없는 계산서 줄(발행여부 등)은 무시
        else if (field === 'mail1') continue; // "주소" 라벨이 집주소 잡는 것 방지
        if (v !== '__SAME__') {
          v = fixEmailTypos(v);
          if (emailFixNote) fixNote = emailFixNote;
        }
      }
      if (field === 'bizNo2') v = fmtBizNo(v);
      if (field === 'tel1') v = formatPhone(v.replace(/[^0-9]/g, '')) || v;
      got[field] = v;
      usedLines.add(li);
      break;
    }
  }
  // 라벨 없는 줄 폴백: 이메일/사업자번호/전화 → 나머지는 업체명 → 담당자 → 아이디
  const leftovers = [];
  for (let li = 0; li < lines.length; li++) {
    const t = lines[li].trim();
    if (!t || usedLines.has(li)) continue;
    if (t.length > 30) continue;
    if (/안녕|감사|부탁|주세요|입니다|할게요|드려요/.test(t)) continue;
    leftovers.push(t);
  }
  const restLines = [];
  for (const l of leftovers) {
    if (!got.mail1 && /@/.test(l)) {
      const em = l.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
      if (em) { got.mail1 = fixEmailTypos(em[0]); if (emailFixNote) fixNote = emailFixNote; continue; }
    }
    const digits = l.replace(/[^0-9]/g, '');
    const numericOnly = /^[\d\s\-\.\(\)~]+$/.test(l);
    if (!got.bizNo2 && numericOnly && digits.length === 10 && /^\d{3}\s*[-\.\s]\s*\d{2}\s*[-\.\s]\s*\d{5}$/.test(l)) {
      got.bizNo2 = digits.slice(0,3) + '-' + digits.slice(3,5) + '-' + digits.slice(5);
      continue;
    }
    if (!got.tel1 && numericOnly && digits.length >= 9 && digits.length <= 12 && (digits.startsWith('0') || digits.startsWith('1'))) {
      got.tel1 = formatPhone(digits) || l;
      continue;
    }
    restLines.push(l);
  }
  for (const l of restLines) {
    const idLike = /^[A-Za-z0-9._-]+$/.test(l) && /\d/.test(l);
    if (!got.uid1 && idLike) { got.uid1 = l; continue; }
    if (!got.chName) { got.chName = l; continue; }
    if (!got.mgr1) { got.mgr1 = l; continue; }
    if (!got.uid1) { got.uid1 = l; continue; }
  }

  // "계산서 이메일 : 시트와 동일" → 시트 이메일로 채움
  if (got.taxMail === '__SAME__') {
    const same = got.mail1 || g('mail1');
    if (same) got.taxMail = same; else delete got.taxMail;
  }

  let filled = 0;
  for (const [field, v] of Object.entries(got)) {
    if (field === 'bizNo2') {
      // 사업자번호는 등록증(①)이 우선 — 비어 있을 때만 채움
      if (!g('bizNo')) { setField('bizNo', v); filled++; updateBiznoBadge(); }
      continue;
    }
    setField(field, v);
    filled++;
  }
  let msg = filled ? '✅ ' + filled + '개 필드 인식' : '⚠️ 인식 실패 — 아래 칸에 직접 입력';
  if (fixNote) msg += ' · ⚠️ 이메일 보정: ' + fixNote;
  status.textContent = msg;
  status.className = filled ? 'parse-status ok' : 'parse-status warn';
}

let certTimer = null, vendorTimer = null;
document.getElementById('certBox').addEventListener('input', () => { clearTimeout(certTimer); certTimer = setTimeout(parseCertBox, 300); });
document.getElementById('vendorBox').addEventListener('input', () => { clearTimeout(vendorTimer); vendorTimer = setTimeout(parseVendorBox, 300); });

// ========== 조합 = 폴백 채움 + TSV 생성 + 자동 복사 ==========
document.getElementById('combineBtn').addEventListener('click', async () => {
  // 폴백: 채널명 없으면 상호로, 담당자 없으면 대표자로
  if (!g('chName') && g('bizName')) setField('chName', g('bizName'));
  if (!g('bizName') && g('chName')) setField('bizName', g('chName'));
  if (!g('mgr1') && g('rep')) setField('mgr1', g('rep'));

  const vals = COLS.map(([, id]) => g(id).replace(/[\t\n\r]+/g, ' '));
  const tsv = vals.join('\t');
  document.getElementById('tsvOutput').value = tsv;
  renderPreview(vals);

  const missing = [];
  if (!vals[0]) missing.push('외부채널명');
  if (!vals[3]) missing.push('사업자번호');
  const biznoOk = validBizNo(vals[3]);

  let copied = false;
  try { await navigator.clipboard.writeText(tsv); copied = true; } catch (e) {}

  // 등록 로그 — 비서 보고서 「당일 신규 추가 업체」가 이 로그를 읽어 자동으로 채운다 (같은 도메인이라 localStorage 공유)
  const logged = logVendor(vals);

  let msg = copied ? '📋 복사 완료! 리모컨에 Ctrl+V' : '✅ 생성 완료 (복사는 아래 버튼으로)';
  if (logged) msg += '\n📒 오늘 등록 ' + logged + '건 — 보고서 신규 업체 칸에 자동으로 들어갑니다';
  let color = 'var(--ok)';
  if (missing.length) { msg += '\n⚠️ 빈 칸: ' + missing.join(', '); color = '#b45309'; }
  if (biznoOk === false) { msg += '\n⚠️ 사업자번호 체크섬 불일치 — 확인 필요'; color = '#b45309'; }
  showToast(msg, color, missing.length || biznoOk === false ? 6000 : 3500);
});

// ========== 등록 로그 (mas_vendor_log_v1) ==========
// 비서(secretary.html)와 같은 도메인이라 localStorage를 공유한다.
// 보고서 모드가 오늘 날짜 로그를 읽어 공유서 「업체 관리 - 당일 신규 추가 업체」 칸을 자동으로 채움.
const VENDOR_LOG_KEY = 'mas_vendor_log_v1';
function vendorLogKey(r){
  return (r.date||'') + '|' + (String(r.사업자번호||'').replace(/[^0-9]/g,'') || r.외부채널명 || r.사업자명 || '');
}
function logVendor(vals){
  try{
    const name = vals[0] || vals[1];
    if (!name) return 0;
    const d = new Date();
    const date = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const rec = {
      date: date,
      at: d.toISOString(),
      외부채널명: vals[0] || '',
      사업자명: vals[1] || '',
      사업자번호: vals[3] || '',
      대표자: vals[18] || '',
      담당자: vals[6] || '',
      연락처: vals[7] || ''
    };
    let log = [];
    try{ log = JSON.parse(localStorage.getItem(VENDOR_LOG_KEY) || '[]'); }catch(e){ log = []; }
    const i = log.findIndex(r => vendorLogKey(r) === vendorLogKey(rec));
    if (i >= 0) log[i] = rec; else log.push(rec);          // 같은 날 같은 업체 재조합 = 덮어쓰기(중복 X)
    localStorage.setItem(VENDOR_LOG_KEY, JSON.stringify(log.slice(-300)));
    return log.filter(r => r.date === date).length;
  }catch(e){ return 0; }
}

function renderPreview(vals){
  const head = document.getElementById('previewHead');
  const row = document.getElementById('previewRow');
  head.innerHTML = '';
  row.innerHTML = '';
  COLS.forEach(([name], i) => {
    const th = document.createElement('th');
    th.textContent = name;
    head.appendChild(th);
    const td = document.createElement('td');
    td.textContent = vals[i] || '·';
    if (!vals[i]) td.className = 'empty';
    row.appendChild(td);
  });
  document.getElementById('previewWrap').classList.add('show');
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const tsv = document.getElementById('tsvOutput').value;
  if (!tsv) { showToast('먼저 [조합]을 눌러주세요', '#b45309'); return; }
  try {
    await navigator.clipboard.writeText(tsv);
    showToast('📋 복사됨 - 리모컨에 Ctrl+V', 'var(--accent)');
  } catch (e) {
    showToast('복사 실패: ' + e.message, '#b45309');
  }
});

document.getElementById('sameMailBtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (g('mail1')) setField('taxMail', g('mail1'));
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('입력 내용을 모두 지울까요?')) return;
  document.querySelectorAll('input[type=text], textarea').forEach(el => { el.value = ''; });
  document.getElementById('active').checked = true;
  const cy = document.getElementById('cycle');
  Array.from(cy.options).forEach(o => { if (!['일정산','주정산','월정산'].includes(o.value)) o.remove(); });
  cy.value = '일정산';
  document.querySelectorAll('.field.parsed').forEach(f => f.classList.remove('parsed'));
  document.getElementById('previewWrap').classList.remove('show');
  document.getElementById('certStatus').textContent = '붙여넣으면 자동 파싱';
  document.getElementById('certStatus').className = 'parse-status';
  document.getElementById('vendorStatus').textContent = '붙여넣으면 자동 파싱';
  document.getElementById('vendorStatus').className = 'parse-status';
  document.getElementById('biznoBadge').textContent = '';
  document.getElementById('biznoBadge').className = 'bizno-badge';
});

function showToast(msg, color, duration){
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  el.style.background = color || 'var(--accent)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration || 3500);
}
</script>
