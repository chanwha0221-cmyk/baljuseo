<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 제안서 생성기 · 주식회사 마스터</title>
</head>
<body>
<style>
  :root{
    --bg:#FAF9F8; --ink:#201F1D; --muted:#8a857d; --gold:#B68235; --line:#e7e4df;
    --serif: Georgia, '바탕', Batang, 'Nanum Myeongjo', serif;
    --ui: -apple-system, 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--ui); color:#222; background:#eceae6; display:flex; flex-direction:column; height:100vh; overflow:hidden}

  .topbar{display:flex; align-items:center; gap:16px; padding:10px 18px; background:#fff; border-bottom:1px solid #ddd; flex:0 0 auto}
  .topbar h1{font-size:15px; margin:0; font-weight:700; color:#201F1D}
  .topbar .sub{font-size:12px; color:#999}
  .topbar .spacer{flex:1}
  .btn{font-family:var(--ui); font-size:13px; border:1px solid #ccc; background:#fff; color:#333; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600}
  .btn:hover{background:#f4f4f4}
  .btn.primary{background:#201F1D; color:#fff; border-color:#201F1D}
  .btn.primary:hover{background:#000}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold)}
  .btn.gold:hover{filter:brightness(.95)}

  .main{display:flex; flex:1; min-height:0}
  .editor{width:420px; flex:0 0 420px; background:#f7f6f4; border-right:1px solid #ddd; overflow-y:auto; padding:16px 16px 80px}
  .preview{flex:1; overflow-y:auto; padding:28px; background:#eceae6}

  .grp{background:#fff; border:1px solid #e5e3df; border-radius:12px; padding:14px; margin-bottom:14px}
  .grp>h2{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 10px}
  .fld{margin-bottom:10px}
  .fld label{display:block; font-size:11px; color:#777; margin-bottom:4px; font-weight:600}
  .fld input, .fld textarea{width:100%; font-family:var(--ui); font-size:13px; border:1px solid #d8d5cf; border-radius:7px; padding:7px 9px; background:#fff; color:#222; resize:vertical}
  .fld textarea{min-height:52px; line-height:1.5}
  .fld input:focus, .fld textarea:focus{outline:none; border-color:var(--gold)}
  .row2{display:flex; gap:8px}
  .row2>*{flex:1}
  .prod{border:1px solid #ece9e4; border-radius:9px; padding:10px; margin-bottom:9px; background:#fbfaf8; position:relative}
  .prod .phead{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .prod .pnum{font-size:11px; font-weight:700; color:#aaa}
  .prod .thumb{width:34px; height:34px; border-radius:6px; object-fit:cover; border:1px solid #e0ddd7; background:#efece6}
  .prod .rmv{margin-left:auto; border:none; background:transparent; color:#c0392b; cursor:pointer; font-size:16px; line-height:1; padding:2px 6px}
  .imgbtn{font-size:11px; color:#555; border:1px dashed #cfccc5; background:#fff; border-radius:6px; padding:5px 8px; cursor:pointer}
  .imgbtn:hover{background:#f3f1ec}
  .addbtn{width:100%; border:1px dashed #c9c5bd; background:#fff; color:#555; padding:9px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600}
  .addbtn:hover{background:#f3f1ec}

  .frame{margin:0 auto 26px; box-shadow:0 6px 26px rgba(0,0,0,.14); background:#fff}
  .stage{width:1280px; height:720px; transform-origin:top left}
  .slide{width:1280px; height:720px; background:var(--bg); color:var(--ink); font-family:var(--serif); position:relative; overflow:hidden; padding:84px 96px}
  .eyebrow{color:var(--gold); font-size:16px; letter-spacing:.22em; font-weight:400; margin:0 0 26px}
  .stitle{font-size:64px; font-weight:400; line-height:1.05; margin:0; letter-spacing:-.01em}
  .muted{color:var(--muted)}

  .cover{display:flex; flex-direction:column; justify-content:center; padding:84px 96px}
  .cover .company{font-size:108px; line-height:1; margin:6px 0 30px; letter-spacing:-.02em}
  .cover .tagline{font-size:29px; line-height:1.5; max-width:820px; margin:0 0 60px; color:#2c2a27}
  .cover .meta{font-size:17px; color:#403d38; border-top:1px solid var(--line); padding-top:22px}

  .about{display:grid; grid-template-columns:1.35fr 1fr; gap:56px; align-items:center}
  .about .lead{font-size:30px; line-height:1.5; margin:26px 0 30px; color:#2c2a27}
  .about ul{margin:0; padding:0; list-style:none}
  .about li{font-size:21px; line-height:1.45; padding:13px 0 13px 26px; border-top:1px solid var(--line); position:relative; color:#33302b}
  .about li:before{content:"—"; position:absolute; left:0; color:var(--gold)}
  .about .photo{width:100%; height:520px; border-radius:14px; object-fit:cover; background:#efece6}

  .lineup .cats{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:44px}
  .cat .cimg{width:100%; height:300px; border-radius:14px; object-fit:cover; background:#efece6; margin-bottom:20px}
  .cat .cname{font-size:34px; margin:0 0 12px}
  .cat .cdesc{font-size:19px; line-height:1.5; color:#514d47; margin:0}

  .plist{margin-top:34px; display:flex; flex-direction:column}
  .prow{display:grid; grid-template-columns:78px 1fr auto auto; gap:26px; align-items:center; padding:16px 4px; border-top:1px solid var(--line)}
  .prow:last-of-type{border-bottom:1px solid var(--line)}
  .prow .pimg{width:78px; height:78px; border-radius:11px; object-fit:cover; background:#efece6}
  .prow .pname{font-size:25px; margin:0 0 4px}
  .prow .pspec{font-size:15px; color:var(--muted); margin:0}
  .prow .pship{text-align:right; min-width:150px}
  .prow .pship .l{font-size:12px; color:var(--gold); letter-spacing:.14em; margin:0 0 3px}
  .prow .pship .v{font-size:16px; color:#3a3733; margin:0}
  .prow .pprice{text-align:right; min-width:150px}
  .prow .pprice .amt{font-size:31px; margin:0; line-height:1}
  .prow .pprice .unit{font-size:14px; color:var(--muted)}
  .pnote{font-size:14px; color:var(--muted); margin-top:22px; line-height:1.5}
  .ptitle-row{display:flex; align-items:baseline; gap:16px}
  .ptitle-row .cnt{font-size:16px; color:var(--gold); letter-spacing:.14em}

  .contact{display:flex; flex-direction:column; justify-content:center}
  .contact .desc{font-size:26px; line-height:1.5; color:#2c2a27; margin:22px 0 46px; max-width:760px}
  .contact .rows{display:grid; grid-template-columns:1fr 1fr; gap:20px 60px; max-width:860px}
  .contact .crow{border-top:1px solid var(--line); padding-top:16px}
  .contact .crow .cl{font-size:13px; color:var(--gold); letter-spacing:.16em; margin:0 0 6px}
  .contact .crow .cv{font-size:24px; margin:0; color:#26241f}

  @media print{
    @page{size:1280px 720px; margin:0}
    body{overflow:visible; height:auto; background:#fff}
    .topbar,.editor{display:none !important}
    .preview{overflow:visible; padding:0}
    .frame{box-shadow:none; margin:0}
    .stage{transform:none !important; page-break-after:always}
    .frame:last-child .stage{page-break-after:auto}
  }
</style>

<div class="topbar">
  <h1>상품 제안서 생성기</h1>
  <span class="sub">내용을 입력하면 슬라이드가 자동으로 만들어집니다</span>
  <div class="spacer"></div>
  <button class="btn" onclick="resetDemo()">데모 내용 복원</button>
  <button class="btn primary" onclick="window.print()">PDF로 저장 / 인쇄</button>
  <button class="btn gold" onclick="exportPptx()">PPTX 다운로드</button>
</div>

<div class="main">
  <div class="editor" id="editor"></div>
  <div class="preview" id="preview"></div>
</div>

let state = load() || demoState();

function save(){ try{ localStorage.setItem('proposal_state_v1', JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem('proposal_state_v1'); return s?JSON.parse(s):null; }catch(e){ return null; } }
function resetDemo(){ if(confirm('입력 내용을 데모 상태로 되돌릴까요?')){ state=demoState(); buildEditor(); renderPreview(); save(); } }

/* ============================ HELPERS ============================ */
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getPath(p){ return p.split('.').reduce((o,k)=> o==null?undefined:o[k], state); }
function setPath(p,v){ const ks=p.split('.'); let o=state; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }

/* ============================ EDITOR ============================ */
function field(label, path, textarea){
  const v = esc(getPath(path));
  if(textarea) return `<div class="fld"><label>${label}</label><textarea data-path="${path}">${v}</textarea></div>`;
  return `<div class="fld"><label>${label}</label><input data-path="${path}" value="${v}"></div>`;
}
function imgField(label, path){
  const v = getPath(path);
  return `<div class="fld"><label>${label}</label>
    <button class="imgbtn" onclick="pickImage('${path}')">${v?'사진 변경':'사진 추가'}</button>
    ${v?`<img class="thumb" src="${v}" style="width:44px;height:44px;margin-left:8px;vertical-align:middle">`:''}</div>`;
}
function buildEditor(){
  const e = document.getElementById('editor');
  let h = '';
  h += `<div class="grp"><h2>표지</h2>
    ${field('상단 라벨','cover.eyebrow')}
    ${field('회사/제목','cover.company')}
    ${field('한 줄 소개','cover.tagline',true)}
    ${field('하단 정보','cover.meta')}</div>`;
  h += `<div class="grp"><h2>회사 소개</h2>
    ${field('제목','about.title')}
    ${field('리드 문장','about.lead',true)}`;
  state.about.bullets.forEach((b,i)=> h+= field('요점 '+(i+1),'about.bullets.'+i,true));
  h += imgField('소개 사진','about.image')+`</div>`;
  h += `<div class="grp"><h2>상품 라인업</h2>${field('제목','lineup.title')}`;
  state.lineup.cats.forEach((c,i)=>{
    h += `<div class="prod"><div class="phead"><span class="pnum">카테고리 ${i+1}</span></div>
      ${field('이름','lineup.cats.'+i+'.name')}
      ${field('설명','lineup.cats.'+i+'.desc',true)}
      ${imgField('사진','lineup.cats.'+i+'.image')}</div>`;
  });
  h += `</div>`;
  state.sections.forEach((sec,si)=>{
    h += `<div class="grp"><h2>상품표 · ${esc(sec.title)}</h2>
      ${field('섹션 제목','sections.'+si+'.title')}`;
    sec.products.forEach((p,pi)=>{
      h += `<div class="prod"><div class="phead">
        <span class="pnum">${pi+1}</span>
        ${p.img?`<img class="thumb" src="${p.img}">`:'<span class="thumb"></span>'}
        <button class="imgbtn" onclick="pickImage('sections.${si}.products.${pi}.img')">사진</button>
        <button class="rmv" title="삭제" onclick="removeProduct(${si},${pi})">✕</button></div>
        ${field('상품명','sections.'+si+'.products.'+pi+'.name')}
        <div class="row2">${field('규격','sections.'+si+'.products.'+pi+'.spec')}${field('택배비','sections.'+si+'.products.'+pi+'.ship')}</div>
        <div class="row2">${field('제안가','sections.'+si+'.products.'+pi+'.price')}${field('단위','sections.'+si+'.products.'+pi+'.unit')}</div>
      </div>`;
    });
    h += `<button class="addbtn" onclick="addProduct(${si})">+ 상품 추가</button>
      ${field('하단 주석','sections.'+si+'.note',true)}</div>`;
  });
  h += `<div class="grp"><h2>연락처</h2>
    ${field('상단 라벨','contact.eyebrow')}
    ${field('제목','contact.title')}
    ${field('설명','contact.desc',true)}`;
  state.contact.rows.forEach((r,i)=> h+=`<div class="row2">${field('항목','contact.rows.'+i+'.label')}${field('값','contact.rows.'+i+'.value')}</div>`);
  h += `</div>`;
  e.innerHTML = h;

  e.querySelectorAll('[data-path]').forEach(el=>{
    el.addEventListener('input', ()=>{ setPath(el.dataset.path, el.value); renderPreview(); save(); });
  });
}
function pickImage(path){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = ()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload = ()=>{ setPath(path, r.result); buildEditor(); renderPreview(); save(); }; r.readAsDataURL(f); };
  inp.click();
}
function addProduct(si){ state.sections[si].products.push({name:"새 상품",spec:"",ship:"",price:"",unit:"/ 개",img:""}); buildEditor(); renderPreview(); save(); }
function removeProduct(si,pi){ state.sections[si].products.splice(pi,1); buildEditor(); renderPreview(); save(); }

/* ============================ PREVIEW ============================ */
function slideCover(c){
  return `<div class="slide cover">
    <p class="eyebrow">${esc(c.eyebrow)}</p>
    <div class="company">${esc(c.company)}</div>
    <p class="tagline">${esc(c.tagline)}</p>
    <p class="meta">${esc(c.meta)}</p></div>`;
}
function slideAbout(a){
  const lis = a.bullets.map(b=>`<li>${esc(b)}</li>`).join('');
  return `<div class="slide about">
    <div><h2 class="stitle">${esc(a.title)}</h2>
      <p class="lead">${esc(a.lead)}</p><ul>${lis}</ul></div>
    <div>${a.image?`<img class="photo" src="${a.image}">`:`<div class="photo"></div>`}</div></div>`;
}
function slideLineup(l){
  const cats = l.cats.map(c=>`<div class="cat">
      ${c.image?`<img class="cimg" src="${c.image}">`:`<div class="cimg"></div>`}
      <h3 class="cname">${esc(c.name)}</h3><p class="cdesc">${esc(c.desc)}</p></div>`).join('');
  return `<div class="slide lineup"><h2 class="stitle">${esc(l.title)}</h2>
    <div class="cats">${cats}</div></div>`;
}
function slideProducts(sec){
  const rows = sec.products.map(p=>`<div class="prow">
      ${p.img?`<img class="pimg" src="${p.img}">`:`<div class="pimg"></div>`}
      <div><p class="pname">${esc(p.name)}</p><p class="pspec">${esc(p.spec)}</p></div>
      <div class="pship"><p class="l">택배비</p><p class="v">${esc(p.ship)}</p></div>
      <div class="pprice"><p class="amt">${esc(p.price)} <span class="unit">${esc(p.unit)}</span></p></div>
    </div>`).join('');
  return `<div class="slide">
    <div class="ptitle-row"><h2 class="stitle">${esc(sec.title)}</h2><span class="cnt">${sec.products.length}종</span></div>
    <div class="plist">${rows}</div>
    ${sec.note?`<p class="pnote">${esc(sec.note)}</p>`:''}</div>`;
}
function slideContact(c){
  const rows = c.rows.map(r=>`<div class="crow"><p class="cl">${esc(r.label)}</p><p class="cv">${esc(r.value)}</p></div>`).join('');
  return `<div class="slide contact"><p class="eyebrow">${esc(c.eyebrow)}</p>
    <h2 class="stitle">${esc(c.title)}</h2><p class="desc">${esc(c.desc)}</p>
    <div class="rows">${rows}</div></div>`;
}
function slidesHtml(){
  let arr = [slideCover(state.cover), slideAbout(state.about), slideLineup(state.lineup)];
  state.sections.forEach(s=> arr.push(slideProducts(s)));
  arr.push(slideContact(state.contact));
  return arr;
}
function renderPreview(){
  const p = document.getElementById('preview');
  p.innerHTML = slidesHtml().map(s=>`<div class="frame"><div class="stage">${s}</div></div>`).join('');
  scaleSlides();
}
function scaleSlides(){
  const pv = document.getElementById('preview');
  const avail = pv.clientWidth - 56;
  const scale = Math.min(1, avail/1280);
  pv.querySelectorAll('.frame').forEach(fr=>{
    const st = fr.querySelector('.stage');
    st.style.transform = `scale(${scale})`;
    fr.style.width = (1280*scale)+'px';
    fr.style.height = (720*scale)+'px';
  });
}
window.addEventListener('resize', scaleSlides);

/* ============================ PPTX EXPORT ============================ */
const GOLD="B68235", INK="201F1D", MUT="8A857D", BG="FAF9F8", LINE="E7E4DF", FONT="Georgia";
function exportPptx(){
  if(typeof PptxGenJS==='undefined'){ alert('PPTX 라이브러리를 불러오지 못했어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.'); return; }
  try{
  const pptx = new PptxGenJS();
  pptx.defineLayout({name:'C', width:13.333, height:7.5});
  pptx.layout='C';
  const W=13.333, H=7.5, MX=1.0, MTOP=0.9;
  const addImg=(s,data,x,y,w,h)=>{ if(!data){ s.addShape(pptx.ShapeType.rect,{x,y,w,h,fill:{color:'EFECE6'},line:{color:'EFECE6'}}); return;} s.addImage({data,x,y,w,h,sizing:{type:'cover',w,h}}); };

  let s=pptx.addSlide(); s.background={color:BG};
  s.addText(state.cover.eyebrow,{x:MX,y:1.5,w:9,h:0.4,fontFace:FONT,fontSize:16,color:GOLD,charSpacing:4});
  s.addText(state.cover.company,{x:MX-0.05,y:1.9,w:11,h:1.7,fontFace:FONT,fontSize:76,color:INK});
  s.addText(state.cover.tagline,{x:MX,y:3.75,w:8.6,h:1.2,fontFace:FONT,fontSize:22,color:'2C2A27',lineSpacingMultiple:1.3});
  s.addShape(pptx.ShapeType.line,{x:MX,y:5.7,w:11.3,h:0,line:{color:LINE,width:1}});
  s.addText(state.cover.meta,{x:MX,y:5.85,w:11,h:0.5,fontFace:FONT,fontSize:14,color:'403D38'});

  s=pptx.addSlide(); s.background={color:BG};
  s.addText(state.about.title,{x:MX,y:MTOP,w:7,h:1,fontFace:FONT,fontSize:46,color:INK});
  s.addText(state.about.lead,{x:MX,y:1.95,w:6.7,h:1.4,fontFace:FONT,fontSize:22,color:'2C2A27',lineSpacingMultiple:1.3});
  const ab = state.about.bullets.map(b=>({text:b, options:{fontSize:16,color:'33302B',fontFace:FONT,bullet:{characterCode:'2014'},paraSpaceAfter:10,paraSpaceBefore:10,lineSpacingMultiple:1.2}}));
  s.addText(ab,{x:MX+0.15,y:3.55,w:6.4,h:3});
  addImg(s, state.about.image, 8.3, 1.1, 4.0, 5.3);

  s=pptx.addSlide(); s.background={color:BG};
  s.addText(state.lineup.title,{x:MX,y:MTOP,w:10,h:1,fontFace:FONT,fontSize:46,color:INK});
  state.lineup.cats.slice(0,2).forEach((c,i)=>{
    const x = MX + i*5.85;
    addImg(s,c.image,x,2.1,5.3,2.6);
    s.addText(c.name,{x,y:4.85,w:5.3,h:0.6,fontFace:FONT,fontSize:26,color:INK});
    s.addText(c.desc,{x,y:5.5,w:5.3,h:1.5,fontFace:FONT,fontSize:15,color:'514D47',lineSpacingMultiple:1.3});
  });

  state.sections.forEach(sec=>{
    s=pptx.addSlide(); s.background={color:BG};
    s.addText([{text:sec.title,options:{fontSize:46,color:INK,fontFace:FONT}},{text:'   '+sec.products.length+'종',options:{fontSize:15,color:GOLD,fontFace:FONT,charSpacing:2}}],{x:MX,y:MTOP,w:11,h:1});
    const top=2.15;
    const rh = Math.min(0.95, (6.5-top)/Math.max(sec.products.length,1));
    sec.products.forEach((p,i)=>{
      const yy = top + i*rh; const cy = yy + rh/2;
      s.addShape(pptx.ShapeType.line,{x:MX,y:yy,w:11.3,h:0,line:{color:LINE,width:1}});
      addImg(s,p.img,MX,cy-0.36,0.72,0.72);
      s.addText(p.name,{x:MX+0.95,y:cy-0.38,w:5.6,h:0.4,fontFace:FONT,fontSize:19,color:INK,valign:'middle'});
      s.addText(p.spec,{x:MX+0.95,y:cy+0.02,w:5.6,h:0.32,fontFace:FONT,fontSize:12,color:MUT,valign:'middle'});
      s.addText('택배비',{x:7.4,y:cy-0.32,w:2.0,h:0.28,fontFace:FONT,fontSize:10,color:GOLD,align:'right',charSpacing:2});
      s.addText(p.ship,{x:7.4,y:cy-0.02,w:2.0,h:0.3,fontFace:FONT,fontSize:13,color:'3A3733',align:'right'});
      s.addText([{text:p.price+' ',options:{fontSize:22,color:INK}},{text:p.unit,options:{fontSize:12,color:MUT}}],{x:9.6,y:cy-0.28,w:2.7,h:0.55,fontFace:FONT,align:'right',valign:'middle'});
    });
    s.addShape(pptx.ShapeType.line,{x:MX,y:top+sec.products.length*rh,w:11.3,h:0,line:{color:LINE,width:1}});
    if(sec.note) s.addText(sec.note,{x:MX,y:6.75,w:11.3,h:0.5,fontFace:FONT,fontSize:12,color:MUT});
  });

  s=pptx.addSlide(); s.background={color:BG};
  s.addText(state.contact.eyebrow,{x:MX,y:1.7,w:9,h:0.4,fontFace:FONT,fontSize:16,color:GOLD,charSpacing:4});
  s.addText(state.contact.title,{x:MX-0.03,y:2.2,w:11,h:1.1,fontFace:FONT,fontSize:56,color:INK});
  s.addText(state.contact.desc,{x:MX,y:3.5,w:8,h:1,fontFace:FONT,fontSize:20,color:'2C2A27',lineSpacingMultiple:1.3});
  state.contact.rows.forEach((r,i)=>{
    const x = MX + (i%2)*5.9, y = 4.9 + Math.floor(i/2)*1.1;
    s.addShape(pptx.ShapeType.line,{x,y,w:5.4,h:0,line:{color:LINE,width:1}});
    s.addText(r.label,{x,y:y+0.1,w:5.4,h:0.3,fontFace:FONT,fontSize:12,color:GOLD,charSpacing:3});
    s.addText(r.value,{x,y:y+0.4,w:5.4,h:0.5,fontFace:FONT,fontSize:20,color:'26241F'});
  });

  pptx.writeFile({fileName:'상품제안서_주식회사마스터.pptx'});
  }catch(err){ alert('PPTX 생성 중 오류: '+err.message); }
}

/* ============================ INIT ============================ */
buildEditor();
renderPreview();
</script>
