<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 제안서 생성기 · 주식회사 마스터</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="제안서_assets/fields.js"></script>
<style>
  :root{ --ui:-apple-system,'Segoe UI','Malgun Gothic',system-ui,sans-serif; --gold:#B68235; --ink:#201F1D; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--ui); background:#4a4844; color:#eee; display:flex; flex-direction:column; height:100vh; overflow:hidden}

  .topbar{display:flex; align-items:center; gap:14px; padding:9px 18px; background:#2c2b28; border-bottom:1px solid #000; flex:0 0 auto}
  .topbar h1{font-size:14px; margin:0; font-weight:700; color:#fff}
  .topbar .sub{font-size:12px; color:#b6b2a8}
  .topbar .spacer{flex:1}
  .btn{font-family:var(--ui); font-size:13px; border:1px solid #5a574f; background:#3a3833; color:#eee; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600}
  .btn:hover{background:#46433c}
  .btn.gold{background:var(--gold); color:#fff; border-color:var(--gold)}
  .btn.gold:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.5; cursor:default}

  .preview{flex:1; overflow-y:auto; padding:30px 20px 60px; display:flex; flex-direction:column; align-items:center; gap:26px}
  .frame{box-shadow:0 8px 30px rgba(0,0,0,.4); background:#fff; flex:0 0 auto}
  .stage{width:1920px; height:1080px; transform-origin:top left; position:relative}
  .slide{width:1920px; height:1080px; position:relative; overflow:hidden; background-size:cover; background-position:center}

  .box{position:absolute; display:flex; flex-direction:column; padding:3px 3px 0; overflow:visible}
  .para{margin:0; width:100%; white-space:pre-wrap}
  .run{font-family:Georgia,'바탕',Batang,'Nanum Myeongjo',serif; outline:none; border-radius:2px; transition:background .1s, box-shadow .1s; cursor:text}
  .run:hover{background:rgba(182,130,53,.14)}
  .run:focus{background:rgba(182,130,53,.20); box-shadow:0 0 0 1.5px rgba(182,130,53,.7)}

  .slabel{position:absolute; top:-24px; left:0; font-size:13px; color:#cfc9bc; font-family:var(--ui)}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:11px 20px; border-radius:9px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.4); opacity:0; transition:opacity .25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1}

  @media print{
    @page{size:1920px 1080px; margin:0}
    body{overflow:visible; height:auto; background:#fff}
    .topbar,.slabel{display:none !important}
    .preview{overflow:visible; padding:0; gap:0}
    .frame{box-shadow:none}
    .stage{transform:none !important; page-break-after:always}
    .frame:last-child .stage{page-break-after:auto}
    .run:hover,.run:focus{background:transparent !important; box-shadow:none !important}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>상품 제안서 생성기</h1>
    <span class="sub">슬라이드 위 글자를 클릭해 바로 수정하세요 · 디자인은 원본 그대로 유지됩니다</span>
    <div class="spacer"></div>
    <button class="btn" onclick="resetAll()">원래 내용으로</button>
    <button class="btn" onclick="window.print()">PDF로 저장 / 인쇄</button>
    <button class="btn gold" id="pptxBtn" onclick="exportPptx()">PPTX 다운로드</button>
  </div>
  <div class="preview" id="preview"></div>
  <div class="toast" id="toast"></div>

<script>
const EMU_PX = 9525;        // EMU per px @ 1920-wide canvas
const PT2PX  = 96/72;       // pt -> px
const values = {};
const defaults = {};

SLIDES.forEach(s=>s.shapes.forEach(sh=>sh.paras.forEach(p=>{
  for(let i=1;i<p.length;i++){ defaults[p[i].k]=p[i].t; values[p[i].k]=p[i].t; }
})));

function bgUrl(n){ return `제안서_assets/bg${n}.${(n===4||n===5)?'jpg':'png'}`; }
function xmlEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function anchToJustify(a){ return a==='ctr'?'center':(a==='b'?'flex-end':'flex-start'); }
function alToText(a){ return a==='ctr'?'center':(a==='r'?'right':(a==='just'?'justify':'left')); }

function build(){
  const pv = document.getElementById('preview');
  pv.innerHTML='';
  SLIDES.forEach(s=>{
    const frame=document.createElement('div'); frame.className='frame';
    const stage=document.createElement('div'); stage.className='stage';
    const label=document.createElement('div'); label.className='slabel'; label.textContent=`슬라이드 ${s.n}`;
    stage.appendChild(label);
    const slide=document.createElement('div'); slide.className='slide';
    slide.style.backgroundImage=`url("${bgUrl(s.n)}")`;
    s.shapes.forEach(sh=>{
      const box=document.createElement('div'); box.className='box';
      box.style.left=(sh.x/EMU_PX)+'px';
      box.style.top=(sh.y/EMU_PX)+'px';
      box.style.width=(sh.w/EMU_PX)+'px';
      box.style.height=(sh.h/EMU_PX)+'px';
      box.style.justifyContent=anchToJustify(sh.anch);
      sh.paras.forEach(p=>{
        const meta=p[0];
        const para=document.createElement('div'); para.className='para';
        para.style.textAlign=alToText(meta.al);
        para.style.lineHeight=(meta.ls*(1-(sh.lr||0))).toFixed(4);
        for(let i=1;i<p.length;i++){
          const r=p[i];
          const span=document.createElement('span'); span.className='run';
          span.contentEditable='true'; span.spellcheck=false;
          span.dataset.k=r.k;
          span.style.fontSize=((r.sz/100)*sh.fs*PT2PX).toFixed(2)+'px';
          span.style.color='#'+r.c;
          if(r.sp) span.style.letterSpacing=((r.sp/100)*PT2PX).toFixed(2)+'px';
          span.textContent=values[r.k];
          span.addEventListener('input',()=>{ values[r.k]=span.textContent; });
          span.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); span.blur(); }});
          para.appendChild(span);
        }
        box.appendChild(para);
      });
      slide.appendChild(box);
    });
    stage.appendChild(slide);
    frame.appendChild(stage);
    pv.appendChild(frame);
  });
  scaleStages();
}
function scaleStages(){
  const pv=document.getElementById('preview');
  const avail=pv.clientWidth-40;
  const scale=Math.min(1, avail/1920);
  pv.querySelectorAll('.frame').forEach(fr=>{
    fr.querySelector('.stage').style.transform=`scale(${scale})`;
    fr.style.width=(1920*scale)+'px';
    fr.style.height=(1080*scale)+'px';
  });
}
window.addEventListener('resize',scaleStages);

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

function resetAll(){
  if(!confirm('수정한 내용을 모두 원래 제안서 내용으로 되돌릴까요?')) return;
  Object.keys(defaults).forEach(k=>values[k]=defaults[k]);
  build();
  toast('원래 내용으로 되돌렸어요');
}

async function exportPptx(){
  const btn=document.getElementById('pptxBtn');
  btn.disabled=true; const old=btn.textContent; btn.textContent='만드는 중…';
  try{
    if(typeof JSZip==='undefined') throw new Error('JSZip 로드 실패 (인터넷 연결 확인)');
    const buf=await fetch('제안서_assets/template.pptx').then(r=>{ if(!r.ok) throw new Error('template.pptx 로드 실패 ('+r.status+')'); return r.arrayBuffer(); });
    const zip=await JSZip.loadAsync(buf);
    for(let n=1;n<=6;n++){
      const path=`ppt/slides/slide${n}.xml`;
      let xml=await zip.file(path).async('string');
      Object.keys(values).forEach(k=>{ if(xml.indexOf(k)>=0) xml=xml.split(k).join(xmlEsc(values[k])); });
      zip.file(path,xml);
    }
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',compression:'DEFLATE'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='상품제안서_주식회사마스터.pptx';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast('PPTX 다운로드 완료 — 원본 디자인 그대로예요');
  }catch(err){
    alert('PPTX 생성 실패: '+err.message);
  }finally{
    btn.disabled=false; btn.textContent=old;
  }
}

build();
</script>
</body>
</html>
