<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 식봄 썸네일 추출기 v1.0</title>
<style>
  :root{ --navy:#2c3e50; --blue:#007bff; --green:#27ae60; --red:#e74c3c; --border:#ced4da; --bg:#f8f9fa; }
  *{box-sizing:border-box;}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;margin:0;background:var(--bg);color:#222;}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;}
  .ver{font-size:11px;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:20px;}
  .wrap{padding:18px 20px 80px;max-width:1100px;margin:0 auto;}
  .panel{background:#fff;border:1px solid #e3e6ea;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:18px;overflow:hidden;}
  .panel-head{padding:10px 16px;background:#f1f3f5;border-bottom:1px solid #e3e6ea;font-weight:700;font-size:14px;color:var(--navy);}
  .panel-body{padding:16px;}
  .guide{font-size:13px;color:#555;background:#eef3f8;border-left:4px solid var(--blue);border-radius:4px;padding:9px 12px;margin-bottom:12px;line-height:1.5;}
  textarea{width:100%;height:140px;padding:11px;border:2px solid var(--border);border-radius:8px;font-size:13px;line-height:1.5;resize:vertical;font-family:monospace;outline:none;}
  textarea:focus{border-color:var(--blue);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  .btn{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;transition:filter .1s;}
  .btn:hover{filter:brightness(.93);}
  .btn:disabled{background:#ccc!important;cursor:not-allowed;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:#555;font-weight:600;font-size:13px;padding:8px 14px;}
  label.fld{font-size:12px;color:#666;font-weight:600;}
  input.txt{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;min-width:240px;}

  .count-pill{font-size:12px;color:#666;font-weight:600;}
  /* 전체 이미지 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px;}
  .thumb{position:relative;border:3px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#eef1f4;aspect-ratio:1/1;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .idx{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px;}
  .thumb.sel{border-color:var(--green);}
  .thumb .pick{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center;}
  .thumb.sel .pick{display:flex;}
  /* 선택 4장 미리보기(450 크롭) */
  .picks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .pick-card{border:1px solid #e3e6ea;border-radius:10px;padding:10px;width:200px;text-align:center;background:#fff;}
  .pick-card .pv{width:180px;height:180px;border-radius:8px;background:#eef1f4;object-fit:cover;display:block;}
  .pick-card .role{font-size:12px;font-weight:700;color:var(--navy);margin:8px 0 6px;}
  .pick-card .role select{font-size:11px;padding:3px;border:1px solid var(--border);border-radius:5px;font-family:inherit;}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;z-index:200;}
  #toast.show{opacity:1;bottom:36px;}
  #toast.warn{background:var(--red);}
  .empty{padding:30px;text-align:center;color:#9aa3ad;font-size:14px;}
</style>
</head>
<body>
<div class="topbar">
  <h1>🖼️ 식봄 썸네일 추출기</h1>
  <span class="ver">v1.0</span>
</div>

<div class="wrap">

  <div class="panel">
    <div class="panel-head">① 상품 상세 HTML 붙여넣기</div>
    <div class="panel-body">
      <div class="guide">상품 상세페이지 HTML을 통째로 붙여넣고 <b>이미지 추출</b>을 눌러주세요. 자동으로 <b>앞 2장(상품 컷) + 맨 뒤 2장(저울·포장)</b>을 골라줘요. 그리드에서 클릭해 선택을 바꿀 수 있습니다 (총 4장).</div>
      <textarea id="html-in" placeholder="<p>...<img src=&quot;https://masterc.co.kr/...jpg&quot;>...&#10;여기에 상품 HTML 붙여넣기"></textarea>
      <div class="row">
        <button class="btn btn-primary" onclick="extractImages()">🔍 이미지 추출</button>
        <label class="fld">파일명 접두어</label>
        <input class="txt" id="prefix" placeholder="예: 특가 한돈 등뼈 3kg">
        <span class="count-pill" id="img-count"></span>
      </div>
    </div>
  </div>

  <div class="panel" id="grid-panel" style="display:none">
    <div class="panel-head">② 전체 이미지 — 클릭해서 4장 선택 <span class="count-pill" id="sel-count" style="margin-left:6px"></span></div>
    <div class="panel-body">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="panel" id="picks-panel" style="display:none">
    <div class="panel-head">③ 선택 4장 — 450×450 크롭 미리보기</div>
    <div class="panel-body">
      <div class="picks" id="picks"></div>
      <div class="row">
        <button class="btn btn-green" onclick="downloadAll()">⬇️ 선택 4장 모두 다운로드 (450×450)</button>
        <span class="count-pill">한 번에 안 받아지면 카드별 ⬇️ 버튼으로 하나씩 받으세요.</span>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// images.weserv.nl 프록시로 450x450 크롭 (fit=cover=가운데 크롭) + CORS 허용 → 브라우저에서 바로 다운로드 가능
const SIZE = 450;
let allImgs = [];      // 전체 이미지 URL (정규화)
let selected = [];     // 선택된 인덱스 배열 (순서 = 1~4)

function normUrl(u){
  let s = (u||'').trim();
  s = s.replace(/\/\.\//g, '/');           // masterc의 /./  정규화
  if(s.startsWith('//')) s = 'https:' + s;
  if(s.startsWith('/')) s = 'https://masterc.co.kr' + s;
  return s;
}
function weserv(url, size){
  const px = size || SIZE;
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(url) + '&w=' + px + '&h=' + px + '&fit=cover&a=center&output=jpg&q=90';
}
function thumbUrl(url){ return weserv(url, 160); }

function extractImages(){
  const html = document.getElementById('html-in').value;
  if(!html.trim()){ toast('HTML을 붙여넣어 주세요','warn'); return; }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const imgs = [...doc.querySelectorAll('img')].map(im=>normUrl(im.getAttribute('src'))).filter(Boolean);
  // 중복 제거(순서 유지)
  allImgs = [...new Set(imgs)];
  if(allImgs.length===0){ toast('이미지를 찾지 못했어요','warn'); return; }

  // 파일명 접두어 자동 채움 (첫 의미있는 텍스트)
  const pf = document.getElementById('prefix');
  if(!pf.value.trim()){
    const firstText = (doc.body.textContent||'').trim().split('\n').map(s=>s.trim()).filter(s=>s.length>=3)[0]||'';
    pf.value = firstText.slice(0,40);
  }

  // 기본 선택: 앞 2장 + 뒤 2장
  const n = allImgs.length;
  if(n>=4) selected = [0,1,n-2,n-1];
  else selected = allImgs.map((_,i)=>i);

  document.getElementById('img-count').textContent = `이미지 ${n}개 추출됨`;
  document.getElementById('grid-panel').style.display='block';
  renderGrid();
  renderPicks();
  toast(`✓ 이미지 ${n}개 — 앞2 + 뒤2 자동 선택됨`);
}

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = allImgs.map((url,i)=>{
    const pos = selected.indexOf(i);
    return `<div class="thumb ${pos>=0?'sel':''}" onclick="toggleSel(${i})" title="${url}">
      <span class="idx">${i+1}</span>
      <span class="pick">${pos>=0?pos+1:''}</span>
      <img src="${thumbUrl(url)}" loading="lazy" alt="${i+1}">
    </div>`;
  }).join('');
  document.getElementById('sel-count').textContent = `${selected.length}/4 선택`;
}

function toggleSel(i){
  const pos = selected.indexOf(i);
  if(pos>=0){ selected.splice(pos,1); }
  else {
    if(selected.length>=4){ toast('4장까지만 선택돼요. 다른 걸 빼고 다시 선택하세요','warn'); return; }
    selected.push(i);
  }
  renderGrid();
  renderPicks();
}

const ROLES = ['상품 컷 1','상품 컷 2','저울 사진','포장 사진'];
function renderPicks(){
  const p = document.getElementById('picks');
  if(selected.length===0){ document.getElementById('picks-panel').style.display='none'; return; }
  document.getElementById('picks-panel').style.display='block';
  p.innerHTML = selected.map((imgIdx,k)=>{
    const url = allImgs[imgIdx];
    return `<div class="pick-card">
      <img class="pv" src="${weserv(url)}" alt="pick${k+1}">
      <div class="role">${k+1}. 원본 #${imgIdx+1}</div>
      <button class="btn-ghost" onclick="downloadOne(${imgIdx},${k})">⬇️ 이 장 받기</button>
    </div>`;
  }).join('');
}

function fileName(k){
  let pf = (document.getElementById('prefix').value||'thumb').trim().replace(/[\\/:*?"<>|]/g,'').slice(0,40) || 'thumb';
  return `${pf}_${k+1}.jpg`;
}

async function downloadOne(imgIdx, k){
  const url = weserv(allImgs[imgIdx]);
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName(k);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast(`✓ ${fileName(k)} 다운로드`);
  }catch(e){
    console.error(e);
    toast('다운로드 실패 — 새 탭으로 엽니다(우클릭 저장)','warn');
    window.open(url, '_blank');
  }
}

async function downloadAll(){
  if(selected.length===0){ toast('선택된 이미지가 없어요','warn'); return; }
  for(let k=0;k<selected.length;k++){
    await downloadOne(selected[k], k);
    await new Promise(res=>setTimeout(res, 600)); // 연속 다운로드 차단 방지
  }
  toast(`✓ ${selected.length}장 다운로드 완료`);
}

let _toastT=null;
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className = type==='warn'?'warn show':'show';
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
