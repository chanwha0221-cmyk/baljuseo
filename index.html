async function analyzeDay_REMOVED(){
  const input=document.getElementById('inp').value.trim();
  if(!input){sl('입력란에 발주서 데이터가 없습니다. (B~J열 — 원가(면세)부터 상품명까지 9칸을 붙여넣으세요)','warn');return;}
  const dateInput=prompt('이번 분석은 어느 날짜 데이터인가요?\n(M/D 형식, 예: 5/8)','');
  if(dateInput===null)return;
  const dm=dateInput.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!dm){sl('날짜 형식이 잘못됨. M/D 형식으로 입력 (예: 5/8)','warn');return;}
  const mon=parseInt(dm[1]),day=parseInt(dm[2]);
  if(mon<1||mon>12||day<1||day>31){sl('잘못된 월/일','warn');return;}
  const dateLabel=mon+'/'+day;
  sl('판매 분석 중...');

  // 입력 파싱 (B~J 9칸 기준 — A열 원번 제외)
  const COL={원가면세:0,원가과세:1,공급가면세:2,공급가과세:3,업체:4,상품:8};
  const num=v=>{
    if(v===null||v===undefined||v==='')return 0;
    const s=String(v).replace(/[^0-9.\-]/g,'');
    return parseFloat(s)||0;
  };
  // 보이지 않는 공백류 안전 버전 (명시적 유니코드)
  const cleanCellSafe=v=>{if(v==null)return'';const s=String(v);let r='';for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c===0xA0||c===0x034F||c===0x061C||c===0x180E||c===0x3000||c===0xFEFF||(c>=0x200B&&c<=0x200F)||(c>=0x202A&&c<=0x202F)||(c>=0x205F&&c<=0x206F)||(c>=0xFE00&&c<=0xFE0F))continue;r+=s[i];}return r.trim();};
  /* OLD_BROKEN_REGEX_BEGIN
  const _x=v=>(v==null?'':String(v)).replace(/[ ​‌‍‎‏   　﻿]/g,'').trim();
  // 보이지 않는 공백류(NBSP, 유니코드 공백 등) 정리 헬퍼 — 일반 공백(U+0020)은 보존
  const cleanCell=v=>(v==null?'':String(v)).replace(/[ ​-‏ - 　﻿]/g,'').trim();
  */
  // cleanCell — 안전 버전(cleanCellSafe) 위임 (구 정규식 버전 깨졌었음)
  const cleanCell=cleanCellSafe;
  // 상품명 정규화 + 수량 추출
  // 1) 괄호 안 내용 모두 제거 — 위치 무관 ("(제주)연안굴비" 의 (제주) prefix도 떼고, "민물장어 (생강 많이)" 의 suffix도 뗌)
  // 2) 닫는 괄호 없는 미완성 괄호는 첫 ( 부터 끝까지 절단
  // 3) 끝의 "x N" / "× N" / "* N" 패턴에서 수량 추출
  // 4) 정규화 후 빈 상품명이면 원본 사용 (방어)
  const parseProduct=name=>{
    const orig=cleanCell(name);
    let s=orig;
    // 정상 닫힌 (...) 그룹 모두 제거 (위치 무관)
    s=s.replace(/\s*[\(（][^\(（\)）]*[\)）]\s*/g,' ');
    // 미완성 괄호(닫힘 없음) — 첫 ( 부터 끝까지 잘라냄
    const pi=s.search(/[\(（]/);
    if(pi>=0)s=s.slice(0,pi);
    s=s.replace(/\s+/g,' ').trim();
    if(!s)s=orig; // 다 잘려서 빈 결과면 원본 사용
    const m=s.match(/^(.*?)\s*[x×*X]\s*(\d+)\s*$/);
    if(m){
      const clean=m[1].trim();
      return{clean:clean||s, qty:parseInt(m[2])};
    }
    return{clean:s,qty:1};
  };
  // 헤더 행 판별: 첫 셀에 한글(원가, 공급가 등) 들어있으면 헤더
  const isHeader=r=>{
    const c0=(r[COL.원가면세]||'').toString().trim();
    return /[가-힣]/.test(c0);
  };
  const rawLines=input.split(/\r?\n/).map(l=>l.split('\t'));
  const lines=rawLines.filter(r=>r.length>=9 && !isHeader(r) && cleanCell(r[COL.업체]) && cleanCell(r[COL.상품]));
  if(lines.length===0){sl('파싱된 행이 없음. B~J열 9칸(원가(면세)~상품명)을 붙여넣었는지 확인하세요.','warn');return;}

  const clientMap={},productMap={};
  let skippedNoCompany=0;
  for(const r of lines){
    const 업체=cleanCell(r[COL.업체]);
    const 상품Raw=cleanCell(r[COL.상품]);
    if(!업체){skippedNoCompany++;continue;}
    const 원가행=num(r[COL.원가면세])+num(r[COL.원가과세]);
    const 공급가행=num(r[COL.공급가면세])+num(r[COL.공급가과세]);
    // 합포장 (/ 구분) — 각 상품을 별도 행으로 분리, 원가·공급가는 N등분
    const parts=상품Raw.split('/').map(p=>p.trim()).filter(Boolean);

      if(!clientMap[ck])clientMap[ck]={업체,상품,수량:0,매출:0,매입:0,마진:0};
      clientMap[ck].수량+=수량; clientMap[ck].매출+=매출; clientMap[ck].매입+=매입; clientMap[ck].마진+=마진;
      if(!productMap[상품키])productMap[상품키]={상품,수량:0,매출:0,매입:0,마진:0};
      productMap[상품키].수량+=수량; productMap[상품키].매출+=매출; productMap[상품키].매입+=매입; productMap[상품키].마진+=마진;
    }
  }

  try{
    const token=await getAccessToken();
    const metaRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}?fields=sheets.properties.title`,{headers:{'Authorization':`Bearer ${token}`}});
    const meta=await metaRes.json();
    if(meta.error){sl('분석 스프레드시트 접근 실패: '+meta.error.message+' (편집자 권한 공유 확인)','warn');return;}
    const titles=(meta.sheets||[]).map(s=>s.properties.title);

    const okC=await mergeAnalysis(token,'업체별판매',dateLabel,Object.values(clientMap),['업체명','상품명'],it=>[it.업체,it.상품]);

    if(!okP)return;
    const skipMsg=skippedNoCompany>0?(', 업체명 누락 '+skippedNoCompany+'행 스킵'):'';
    sl('판매 분석 완료! '+dateLabel+' ('+lines.length+'행 처리'+skipMsg+')','ok');
  }catch(e){sl('분석 오류: '+e.message,'warn');}
}
async function rollbackDate_REMOVED(){
  const dateInput=prompt('어느 날짜 데이터를 롤백(삭제)할까요?\n(M/D 형식, 예: 5/8)\n\n해당 날짜의 수량/매출/마진 컬럼이 두 분석 시트에서 모두 제거됩니다.','');

  const dm=dateInput.trim().match(/^(\d{1,2})\/(\d{1,2})$/);

    const okC=await mergeAnalysis(token,'업체별판매',dateLabel,[],['업체명','상품명'],it=>[]);
    if(!okC)return;
    const okP=await mergeAnalysis(token,'전체판매',dateLabel,[],['상품명'],it=>[]);
    if(!okP)return;
    sl(dateLabel+' 데이터 롤백 완료! (그 날짜에만 데이터 있던 상품 행은 자동 삭제됨)','ok');
  }catch(e){sl('롤백 오류: '+e.message,'warn');}
}
async function mergeAnalysis_REMOVED(token,sheetName,dateLabel,items,keyCols,getKey){
  const readRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}/values/${encodeURIComponent(sheetName)}!A1:ZZ20000`,{headers:{'Authorization':`Bearer ${token}`}});
  const readData=await readRes.json();
  const existing=readData.values||[];
  const header=existing[0]||[];
  const rows=existing.slice(1);

  // 끝의 합계 컬럼들 분리 (구버전: 합계 수량/매출/마진/마진율 4개, 신버전: 합계 마진율 1개)
  let dataHeaders=header.slice(keyCols.length);
  // 신버전: 마지막이 "합계 마진율"
  while(dataHeaders.length>0 && /^합계\s/.test(dataHeaders[dataHeaders.length-1])){
    dataHeaders=dataHeaders.slice(0,dataHeaders.length-1);
  }

  // 기존 날짜 컬럼 → 위치 매핑
  const dateMap={}; // dateLabel → {수량:idx, 매출:idx, 마진:idx} (dataHeaders 기준)
  for(let i=0;i<dataHeaders.length;i++){
    const m=dataHeaders[i].match(/^(\d{1,2}\/\d{1,2})\s+(수량|매출|마진)$/);
    if(m){
      if(!dateMap[m[1]])dateMap[m[1]]={};
      dateMap[m[1]][m[2]]=i;
    }
  }

  // 기존 행 → rowMap
  const rowMap={};
  const num=v=>{const s=(v||'').toString().replace(/[^0-9.\-]/g,'');return parseFloat(s)||0;};
  // 보이지 않는 공백류 안전 — 정규식 대신 charCode 비교
  const cleanCell=v=>{if(v==null)return'';const s=String(v);let r='';for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c===0xA0||c===0x034F||c===0x061C||c===0x180E||c===0x3000||c===0xFEFF||(c>=0x200B&&c<=0x200F)||(c>=0x202A&&c<=0x202F)||(c>=0x205F&&c<=0x206F)||(c>=0xFE00&&c<=0xFE0F))continue;r+=s[i];}return r.trim();};
  /* OLD_BROKEN_REGEX_2:
  const _y=v=>(v==null?'':String(v)).replace(/[ ​ -   　﻿]/g,'').trim();
  */
  let lastFirstKey=''; // 셀 병합으로 인해 빈 업체명이 나오면 위쪽 행에서 채우기 위함
  for(const row of rows){
    const keyVals=keyCols.map((_,i)=>(row[i]||'').toString());
    if(keyVals.every(v=>!cleanCell(v)))continue;
    // 첫 키 컬럼(업체명)이 비어있으면 위쪽 행에서 propagate (셀 병합 영향 보정)
    if(keyCols[0]==='업체명'){
      const c0=cleanCell(keyVals[0]);
      if(c0){lastFirstKey=c0;keyVals[0]=c0;}
      else if(lastFirstKey){keyVals[0]=lastFirstKey;}
      // 그래도 비어있으면 (이전 valid 업체명 없음) — 깨진 잔재 데이터, 스킵
      if(!cleanCell(keyVals[0]))continue;
    }
    // 키 컬럼들 다 cleanCell 처리 (공백 정규화)
    for(let i=0;i<keyVals.length;i++)keyVals[i]=cleanCell(keyVals[i]);
    // 요약 행(상품명="총합") 스킵 — 다시 누적되지 않게
    if(keyVals[keyVals.length-1]==='총합')continue;
    // 상품명 비어있어도 스킵
    if(!keyVals[keyVals.length-1])continue;
    // 공백 차이로 분리되는 상품을 묶기 위해 키는 공백 제거 정규화 사용
    const k=keyVals.map(v=>v.replace(/\s+/g,'')).join('||');
    const dates={};
    for(const [d,mIdx] of Object.entries(dateMap)){
      const obj={};
      for(const [metric,idx] of Object.entries(mIdx)){
        const cell=row[keyCols.length+idx];
        const n=num(cell);
        if(n!==0)obj[metric]=n;
      }
      if(Object.keys(obj).length)dates[d]=obj;
    }
    // 같은 정규화 키 중복 시 (시트에 공백만 다른 행 여러 개) → dates 합산 병합
    if(!rowMap[k]){
      rowMap[k]={keyVals,dates};
    }else{
      for(const [d,obj] of Object.entries(dates)){
        if(!rowMap[k].dates[d])rowMap[k].dates[d]={};
        for(const [metric,val] of Object.entries(obj)){
          rowMap[k].dates[d][metric]=(rowMap[k].dates[d][metric]||0)+val;
        }
      }
    }
  }

  // 같은 날짜 데이터 자동 교체 (확인창 없이 그 날짜 데이터 다 지우고 새로 넣음)
  for(const v of Object.values(rowMap))delete v.dates[dateLabel];

  // 신규 데이터 병합 (공백 정규화 키 사용 + 같은 키일 경우 가산 병합)
  for(const item of items){
    const keyVals=getKey(item);
    const k=keyVals.map(v=>(v||'').replace(/\s+/g,'')).join('||');
    if(!rowMap[k])rowMap[k]={keyVals,dates:{}};
    if(!rowMap[k].dates[dateLabel])rowMap[k].dates[dateLabel]={수량:0,매출:0,마진:0};
    rowMap[k].dates[dateLabel].수량+=item.수량||0;
    rowMap[k].dates[dateLabel].매출+=item.매출||0;
    rowMap[k].dates[dateLabel].마진+=item.마진||0;
  }

  // 모든 날짜 수집 + 오름차순(왼쪽=과거)
  const allDates=new Set();
  for(const v of Object.values(rowMap))for(const d of Object.keys(v.dates))allDates.add(d);
  const sortedDates=Array.from(allDates).sort((a,b)=>{
    const am=a.match(/^(\d+)\/(\d+)$/),bm=b.match(/^(\d+)\/(\d+)$/);
    return (am?parseInt(am[1])*100+parseInt(am[2]):0)-(bm?parseInt(bm[1])*100+parseInt(bm[2]):0);
  });

  // 새 헤더 (합계 수량 / 합계 매출 / 합계 마진율)
  const newHeader=[...keyCols];
  for(const d of sortedDates)newHeader.push(d+' 수량',d+' 매출',d+' 마진');
  newHeader.push('합계 수량','합계 매출','합계 마진율');

  // 행 빌드 + 합계 (마진율은 숫자로 저장, % 포맷은 시트 쪽에서 적용)
  const newRows=[];
  for(const v of Object.values(rowMap)){
    const r=v.keyVals.slice();
    let sQ=0,sR=0,sM=0;
    for(const d of sortedDates){
      const dat=v.dates[d]||{};
      const q=dat.수량||0,R=dat.매출||0,M=dat.마진||0;
      r.push(q||'',R||'',M||'');
      sQ+=q; sR+=R; sM+=M;
    }
    const rate=sR>0?Math.round((sM/sR)*10000)/100:0;
    r.push(sQ||'',sR||'',sR>0?rate:'');
    // 정렬용 메타
    r._sR=sR; r._sM=sM; r._sRate=rate; r._sQ=sQ;
    // 모든 합계 0이면 제외
    if(sQ===0 && sR===0 && sM===0)continue;
    newRows.push(r);
  }

  // 정렬: 매출 → 마진 → 마진율 → 수량 (모두 내림차순)
  const cmp=(a,b)=>{
    if(b._sR!==a._sR)return b._sR-a._sR;
    if(b._sM!==a._sM)return b._sM-a._sM;
    if(b._sRate!==a._sRate)return b._sRate-a._sRate;
    return b._sQ-a._sQ;
  };
  // 업체별판매: 업체끼리 묶고 → 업체 합계 순위로 그룹 정렬 → 그룹 안에서 상품별 정렬 → 그룹 끝에 "총합" 행 추가
  if(keyCols[0]==='업체명'){
    const groups={};
    for(const r of newRows){
      const c=r[0];
      if(!groups[c])groups[c]={rows:[],_sR:0,_sM:0,_sQ:0};
      groups[c].rows.push(r);
      groups[c]._sR+=r._sR; groups[c]._sM+=r._sM; groups[c]._sQ+=r._sQ;
    }
    for(const g of Object.values(groups)){
      g._sRate=g._sR>0?Math.round((g._sM/g._sR)*10000)/100:0;
    }
    const sortedGroups=Object.values(groups).sort(cmp);
    for(const g of sortedGroups)g.rows.sort(cmp);
    newRows.length=0;
    for(const g of sortedGroups){
      const company=g.rows[0][0];
      for(const r of g.rows)newRows.push(r);
      // 업체 총합 행 (per-date 수량은 비우고 매출/마진만, 합계는 수량/매출/마진율)
      const sumRow=[company,'총합'];
      let totalQ=0,totalR=0,totalM=0;
      for(let d=0;d<sortedDates.length;d++){
        let dQ=0,dR=0,dM=0;
        for(const gr of g.rows){
          dQ+=parseFloat(gr[keyCols.length+d*3])||0;
          dR+=parseFloat(gr[keyCols.length+d*3+1])||0;
          dM+=parseFloat(gr[keyCols.length+d*3+2])||0;
        }
        sumRow.push('', dR||'', dM||''); // per-date 수량 빈칸 유지
        totalQ+=dQ; totalR+=dR; totalM+=dM;
      }
      const rate=totalR>0?Math.round((totalM/totalR)*10000)/100:0;
      sumRow.push(totalQ||'',totalR||'',totalR>0?rate:'');
      newRows.push(sumRow);
    }
  }else{
    newRows.sort(cmp);
  }

  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}/values/${encodeURIComponent(sheetName)}!A1:ZZ20000:clear`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}});
  const finalData=[newHeader,...newRows];
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}/values/${encodeURIComponent(sheetName)}!A1?valueInputOption=RAW`,{method:'PUT',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({values:finalData})});

  // === 포맷팅 ===
  try{
    // 시트 ID 조회
    const meta2Res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}?fields=sheets.properties`,{headers:{'Authorization':`Bearer ${token}`}});
    const meta2=await meta2Res.json();
    const sheetInfo=(meta2.sheets||[]).find(s=>s.properties.title===sheetName);
    if(!sheetInfo)return true;
    const sheetId=sheetInfo.properties.sheetId;
    const numCols=newHeader.length;
    const numRowsTotal=finalData.length; // 헤더 포함
    const dateCount=sortedDates.length;
    const firstNumColIdx=keyCols.length;
    const lastNumColIdx=firstNumColIdx+dateCount*3; // 날짜 컬럼 끝 (exclusive)
    const rateColIdx=numCols-1; // 합계 마진율

    const reqs=[];
    // 1) 기존 셀 병합 해제 + 포맷 리셋 (큰 범위로)
    reqs.push({unmergeCells:{range:{sheetId,startRowIndex:0,endRowIndex:5000,startColumnIndex:0,endColumnIndex:50}}});
    reqs.push({updateBorders:{range:{sheetId,startRowIndex:0,endRowIndex:numRowsTotal+5,startColumnIndex:0,endColumnIndex:numCols},top:{style:'NONE'},bottom:{style:'NONE'},left:{style:'NONE'},right:{style:'NONE'},innerHorizontal:{style:'NONE'},innerVertical:{style:'NONE'}}});
    // 1b) 숫자 포맷 리셋 — 이전 실행의 잔재 % 포맷 등이 새 컬럼 위치에 남지 않게 일괄 콤마로 초기화
    reqs.push({repeatCell:{range:{sheetId,startRowIndex:0,endRowIndex:5000,startColumnIndex:0,endColumnIndex:50},cell:{userEnteredFormat:{numberFormat:{type:'NUMBER',pattern:'#,##0'}}},fields:'userEnteredFormat.numberFormat'}});

    // 2) 첫 행 고정
    reqs.push({updateSheetProperties:{properties:{sheetId,gridProperties:{frozenRowCount:1}},fields:'gridProperties.frozenRowCount'}});

    // 3) 헤더 행: 굵게 + 가운데 정렬 + 연회색 배경
    reqs.push({repeatCell:{range:{sheetId,startRowIndex:0,endRowIndex:1,startColumnIndex:0,endColumnIndex:numCols},cell:{userEnteredFormat:{horizontalAlignment:'CENTER',verticalAlignment:'MIDDLE',textFormat:{bold:true},backgroundColor:{red:0.93,green:0.93,blue:0.93}}},fields:'userEnteredFormat(horizontalAlignment,verticalAlignment,textFormat,backgroundColor)'}});

    // 4) 키 컬럼 (업체명/상품명) 데이터 영역: 가운데 정렬
    if(numRowsTotal>1){
      reqs.push({repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:numRowsTotal,startColumnIndex:0,endColumnIndex:keyCols.length},cell:{userEnteredFormat:{horizontalAlignment:'CENTER',verticalAlignment:'MIDDLE'}},fields:'userEnteredFormat(horizontalAlignment,verticalAlignment)'}});
    }

    // 5) 날짜 수량/매출/마진 + 합계 수량/매출 컬럼: 천 단위 콤마 + 가운데 (마진율 제외)
    if(numRowsTotal>1 && rateColIdx>firstNumColIdx){
      reqs.push({repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:numRowsTotal,startColumnIndex:firstNumColIdx,endColumnIndex:rateColIdx},cell:{userEnteredFormat:{numberFormat:{type:'NUMBER',pattern:'#,##0'},horizontalAlignment:'CENTER',verticalAlignment:'MIDDLE'}},fields:'userEnteredFormat(numberFormat,horizontalAlignment,verticalAlignment)'}});
    }

    // 6) 합계 마진율 컬럼: "30.77%" 형식 + 가운데
    if(numRowsTotal>1){
      reqs.push({repeatCell:{range:{sheetId,startRowIndex:1,endRowIndex:numRowsTotal,startColumnIndex:rateColIdx,endColumnIndex:rateColIdx+1},cell:{userEnteredFormat:{numberFormat:{type:'NUMBER',pattern:'0.00"%"'},horizontalAlignment:'CENTER',verticalAlignment:'MIDDLE'}},fields:'userEnteredFormat(numberFormat,horizontalAlignment,verticalAlignment)'}});
    }

    // 7) 컬럼 너비 자동 조정
    reqs.push({autoResizeDimensions:{dimensions:{sheetId,dimension:'COLUMNS',startIndex:0,endIndex:numCols}}});

    // 8) 업체별판매: 업체별로 묶고 → 업체명 셀 병합 + 그룹 외곽 테두리
    if(keyCols[0]==='업체명' && newRows.length>0){
      let s=0;
      for(let i=1;i<=newRows.length;i++){
        const reachedEnd=(i===newRows.length);
        const isBoundary=reachedEnd||(newRows[i][0]!==newRows[s][0]);
        if(isBoundary){
          const sheetStartRow=s+1; // 헤더가 0행, 데이터는 1행부터
          const sheetEndRow=i+1;   // exclusive
          const grpSize=i-s;
          // 그룹이 2행 이상일 때만 셀 병합
          if(grpSize>=2){
            reqs.push({mergeCells:{range:{sheetId,startRowIndex:sheetStartRow,endRowIndex:sheetEndRow,startColumnIndex:0,endColumnIndex:1},mergeType:'MERGE_ALL'}});
          }
          // 그룹 외곽 테두리
          const border={style:'SOLID',width:1,color:{red:0.4,green:0.4,blue:0.4}};
          reqs.push({updateBorders:{range:{sheetId,startRowIndex:sheetStartRow,endRowIndex:sheetEndRow,startColumnIndex:0,endColumnIndex:numCols},top:border,bottom:border,left:border,right:border}});
          s=i;
        }
      }
    }

    if(reqs.length>0){
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ANALYSIS_SPREADSHEET_ID}:batchUpdate`,{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({requests:reqs})});
    }
  }catch(e){console.warn('포맷 적용 실패(데이터는 정상 저장됨):',e);}
  return true;
}
async function getAccessToken(){
  const header={alg:'RS256',typ:'JWT'};
  const now=Math.floor(Date.now()/1000);
  const claim={iss:CLIENT_EMAIL,scope:'https://www.googleapis.com/auth/spreadsheets',aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now};
  const enc=(obj)=>btoa(JSON.stringify(obj)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  const toSign=enc(header)+'.'+enc(claim);
  const pem=PRIVATE_KEY.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const bin=Uint8Array.from(atob(pem),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('pkcs8',bin,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,new TextEncoder().encode(toSign));
  const jwt=toSign+'.'+btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  const res=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`});
  const d=await res.json();return d.access_token;
}
async function saveToSheet(){
  // .trim()을 쓰면 마지막 행 끝 탭(빈 셀)이 잘려나가 칸이 안 맞춰지므로,
  // 줄바꿈만 양끝에서 제거하고 탭은 보존
  const val=document.getElementById('out').value.replace(/^[\r\n]+|[\r\n]+$/g,'');
  if(!val){sl('출력 데이터가 없습니다.','warn');return;}
  sl('시트에 저장 중...');
  try{
    const token=await getAccessToken();
    const rRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}!A:N`,{headers:{'Authorization':`Bearer ${token}`}});
    const rData=await rRes.json();
    const lastRow=rData.values?rData.values.length:0;
    const nextRow=Math.max(lastRow+1,8);
    const lines=val.split('\n').filter(l=>l.trim());
    let rows=lines.map(l=>l.split('\t'));
    // 행마다 칸 수 다를 수 있으니 max 기준으로 시작 컬럼 결정
    // 10칸 행이 하나라도 있으면 9칸 행은 앞에 빈칸 추가해 10칸으로 정렬 (E열 비우고 F부터 시작)
    const maxCols=rows.length?Math.max(...rows.map(r=>r.length)):9;
    if(maxCols>=10){
      rows=rows.map(r=>r.length<maxCols?Array(maxCols-r.length).fill('').concat(r):r);
    }
    const firstCols=maxCols;

function preprocessHyein(line){

    if(pm){const idx=rest.lastIndexOf(pm[0]);addr=rest.slice(0,idx).trim();custPhone=pm[0];msg=rest.slice(idx+pm[0].length).trim();}

function extractPhoneFromAddr(addr){

function pr2(line){
  const cols=line.split('\t');if(cols.length<4)return null;
  // '창고명' 레이블 컬럼이 첫 칸에 있으면 제거 (팡베베 등 창고명 포함 발주서 형식 대응)
  if(cols[0].trim()==='창고명')cols.shift();
  if(cols.length<4)return null;
  const cl=cols[0].trim().replace(/\s+/g,'');
  let trailingQty=null;
  const lastCol=(cols[cols.length-1]||'').trim();
  if(lastCol.match(/^\d{1,3}$/)&&parseInt(lastCol)>0&&parseInt(lastCol)<1000){trailingQty=parseInt(lastCol);cols.pop();}
  // 단위 패턴: 숫자+단위 (단위 뒤에 한글이 더 붙으면 매치 안 함 — "1단지" 같은 주소 오인식 방지)
  //          OR "숫자 x 숫자" (예: 500 x 2)
  //          OR 문자열 끝의 "x N" (예: ...x 1)
  const unitPattern=/\d+(kg|g|ea|팩|미|구|개|마리|인분|봉|통|박스|세트|리터|ml|L|판|대|장|줄|관|단|마|모|벌)(?![가-힣])|\d+\s*[xX×]\s*\d+|[xX×]\s*\d+\s*$/i;
  let pi=-1;
  for(let i=1;i<cols.length;i++){if(unitPattern.test((cols[i]||'').trim())){pi=i;break;}}
  if(pi===-1){for(let i=1;i<cols.length;i++){const c=(cols[i]||'').trim();if(c&&!isPhone(c)&&!isPureNum(c)&&c.length>3){pi=i;break;}}}
  if(pi===-1)pi=1;
  let cp='';
  for(let ci=pi-1;ci>=1&&ci>=pi-4;ci--){const cv=(cols[ci]||'').trim();if(isPhone(cv)){cp=cv;break;}}
  const addrKeywords=['시','구','군','동','로','길','읍','면','리'];
  const col1=(cols[1]||'').trim();
  const col1isAddr=addrKeywords.some(k=>col1.includes(k))&&col1.length>5;
  // col1이 명시적으로 빈칸이면 주문처 주소도 빈칸으로 처리 (전처리 함수들이 의도한 형식)
  const ca2=col1isAddr?col1:(col1===''?'':(pi>=3?(cols[pi-2]||'').trim():''));
  const prod=(cols[pi]||'').trim();
  const nextCol=(cols[pi+1]||'').trim();
  const hasQtyCol=isPureNum(nextCol)&&parseInt(nextCol)>0&&parseInt(nextCol)<1000;
  const qtyColOffset=hasQtyCol?1:0;
  const nr=(cols[pi+1+qtyColOffset]||'').trim();
  const rawAddr=(cols[pi+2+qtyColOffset]||'').trim();
  const extracted=extractPhoneFromAddr(rawAddr);
  let addr=extracted.addr;const addrPhone=extracted.phone;
  const p1=(cols[pi+3+qtyColOffset]||'').trim();
  const p2=(cols[pi+4+qtyColOffset]||'').trim();
  const p3=(cols[pi+5+qtyColOffset]||'').trim();
  let custPhone='',msg='';
  if(isPhone(p1)){custPhone=p1;msg=p2+(p3?' '+p3:'');}
  else if(isPhone(p2)){custPhone=p2;msg=p3;}
  else{custPhone=p1||p2||addrPhone;msg=p3;}
  const qm=prod.match(/[xX×]\s*(\d+)\s*$/);
  let qty=1;
  if(qm)qty=parseInt(qm[1]);else if(trailingQty)qty=trailingQty;
  const qtyColValue=hasQtyCol?parseInt(nextCol):1;
  return{client:cl,ca:ca2,cp,prod,nameRaw:nr,address:addr,custPhone,msg,qty,qtyColValue};
}

function preprocessKakaoOrder(raw){

  return output.join('\n');
}
// ===== 세로형 카톡 발주 (안심번호/배송주소/배송메모 라벨 포맷) =====
// 형식 예시:
//   업체명
//   업체전화
//   상품명 (여러 줄 가능)
//   X1 또는 x1 (수량, 별도 줄)
//   받는사람
//   연락처(안심번호)
//   고객전화
//   배송주소
//   (12345) 주소
//   배송메모
//   메모
// 여러 주문은 구분선(— 또는 -, =, _ 3개 이상) 또는 빈 줄로 분리
function isVerticalKakaoFormat(raw){
  return /연락처\s*\(\s*안심번호\s*\)/.test(raw) && /배송\s*주소/.test(raw);
}
function preprocessVerticalKakao(raw){
  // 블록 분리: 구분선(— - = _ 3개 이상) 또는 2줄 이상의 빈 줄
  const blocks = raw.split(/\n\s*(?:[—\-=_–]{3,}|\n\s*\n)\s*/).map(b=>b.trim()).filter(Boolean);
  const rows = [];
  for(const block of blocks){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length<4) continue;
    let phoneLabelIdx=-1, addrLabelIdx=-1, memoLabelIdx=-1;
    lines.forEach((l,i)=>{
      if(phoneLabelIdx<0 && /^연락처\s*\(\s*안심번호\s*\)\s*$/.test(l)) phoneLabelIdx=i;
      else if(addrLabelIdx<0 && /^배송\s*주소\s*$/.test(l)) addrLabelIdx=i;
      else if(memoLabelIdx<0 && /^배송\s*메모\s*$/.test(l)) memoLabelIdx=i;
    });
    if(phoneLabelIdx<0 || addrLabelIdx<0) continue;
    const client = lines[0].replace(/\s+/g,'');
    const orderPhone = fp(lines[1]||'');
    // 받는사람 = 안심번호 라벨 바로 윗줄
    const recipientName = lines[phoneLabelIdx-1] || '';
    // 상품 + 수량: line 2 ~ recipientName 직전
    let product='';let qty=1;
    for(let i=2;i<phoneLabelIdx-1;i++){
      const p=lines[i].trim();
      const qm=p.match(/^[xX×]\s*(\d+)\s*$/);
      if(qm){qty=parseInt(qm[1]);}
      else if(p) product = product? product+' '+p : p;
    }
    // 상품 끝에 "x N" 형태가 같은 줄에 붙어있는 경우도 처리
    const inlineQm = product.match(/[xX×]\s*(\d+)\s*$/);
    if(inlineQm && qty===1){qty=parseInt(inlineQm[1]);product=product.slice(0,inlineQm.index).trim();}
    const custPhone = fp(lines[phoneLabelIdx+1]||'');
    let addr = lines[addrLabelIdx+1]||'';
    addr = addr.replace(/^\s*\(\d{5}\)\s*/,'').trim();  // (우편번호) 제거
    const memo = (memoLabelIdx>=0 && lines[memoLabelIdx+1]) ? lines[memoLabelIdx+1] : '';
    const productLine = product + ' x ' + qty;
    rows.push([client,'',orderPhone,'',productLine,recipientName,addr,custPhone,memo].join('\t'));
  }
  return rows.join('\n');
}
// ===== 365바겐 전용 파서 =====
function is365BagenFormat(raw){
  return raw.includes('보내는 사람')&&raw.replace(/\s/g,'').includes('365바겐');
}
function preprocess365Bagen(raw){
  const allLines=raw.split('\n').map(l=>l.trim());
  const sepPositions=[];
  for(let i=0;i<allLines.length;i++){if(allLines[i]==='보내는 사람')sepPositions.push(i);}
  const output=[];
  for(const sepIdx of sepPositions){
    // 업체 정보 (보내는 사람 이후)
    const vendorRaw=toTsv(allLines[sepIdx+1]||'');
    const vendorCols=vendorRaw.split('\t');
    const vendorName=vendorCols[vendorCols.length-1].trim().replace(/\s+/g,'');
    const vendorAddr=vendorCols.slice(0,-1).join(' ').trim();
    const vendorPhone=fp(allLines[sepIdx+2]||'');
    // 상품 라인: 보내는 사람 바로 위 줄
    let prodLineIdx=sepIdx-1;
    while(prodLineIdx>=0&&!allLines[prodLineIdx])prodLineIdx--;
    const prodRaw=toTsv(allLines[prodLineIdx]||'');
    const prodCols=prodRaw.split('\t');
    // 수량: (8팩요청드립니다) 패턴
    const qtyM=prodRaw.match(/\((\d+)[팩개박스]/);
    const qty=qtyM?parseInt(qtyM[1]):1;
    // 상품명: 두 번째 컬럼부터 한글+무게단위 있는 것 (첫 컬럼=창고/지역명 제외)
    let prodName='';
    for(let k=1;k<prodCols.length;k++){
      const c=prodCols[k].trim();
      if(/[가-힣]/.test(c)&&/\d+(g|kg)/i.test(c)&&!c.endsWith('원')){prodName=c;break;}
    }
    if(!prodName&&prodCols.length>1)prodName=prodCols[1].trim();
    if(!prodName)continue;
    // 고객 정보: 상품라인 위 빈 줄 만날 때까지
    const custLines=[];
    for(let k=prodLineIdx-1;k>=0;k--){
      if(!allLines[k])break;
      custLines.unshift(allLines[k]);
    }
    let custPhone='',custName='',custAddr='';
    for(const l of custLines){
      if(isPhone(l)){if(!custPhone)custPhone=fp(l);}
      else if(!custAddr)custAddr=l;
      else if(!custName)custName=l;
    }
    output.push([vendorName,vendorAddr,vendorPhone,'',prodName+' x '+qty,custName,custAddr,custPhone,''].join('\t'));
  }
  return output.join('\n');
}
// ===== 365바겐 파서 끝 =====

function isSikbomFormat(raw){const first=raw.trim().split('\n')[0].trim();return /^\d{9}[\t ]/.test(first)&&first.includes('GPG');}
function normSikbomProd(raw){return raw.replace(/^(버피|연안)\s+/,'').trim();}
function normLine(l){const t=l.trim();return t.includes('\t')?t:t.replace(/ {2,}/g,'\t');}
function isOrderHdr(l){return /^\d{9}[\t ]/.test(l)&&l.includes('GPG');}
function extractAddrPhone(a){
  const m=a.match(/(0\d{1,2}[\s]?\d{3,4}[\s]?\d{4})/);
  if(!m)return{addr:a.trim(),msg:''};
  const ix=a.indexOf(m[1]);
  return{addr:a.slice(0,ix).trim(),msg:a.slice(ix+m[1].length).trim()};
}
// 식봄 단일라인 파서 — 한 주문이 한 줄에 40여개 컬럼으로 들어오는 신형식 (2026-05+ 신규)
function parseSikbomSingleLine(line){
  const cols=line.split('\t').map(c=>(c||'').trim());
  if(cols.length<20)return null;
  if(!isOrderHdr(line))return null;
  let custName='',custPhone='',prodName='',qty=1,address='',msg='';
  // 받는사람: "발주대기" 다음 셀
  const bi=cols.findIndex(c=>c==='발주대기');
  if(bi>=0&&cols[bi+1])custName=cols[bi+1];
  // 고객 연락처: 010/011 패턴
  for(const c of cols){
    if(/^01\d{8,9}$/.test(c)){custPhone=fp(c);break;}
  }
  // 상품명: "버피 " 또는 "연안 " 시작 + g/kg 포함
  for(const c of cols){
    if(/^(버피|연안)\s+/.test(c)&&/\d+(g|kg)/i.test(c)){prodName=normSikbomProd(c);break;}
  }
  // 수량: EA 마커 다음 첫 정수 (1-3자리, 1000 미만 — 단가 4-5자리와 구분)
  const eaIdx=cols.findIndex(c=>c==='EA');
  if(eaIdx>=0){
    for(let j=eaIdx+1;j<Math.min(eaIdx+8,cols.length);j++){
      const c=cols[j];
      if(/^\d{1,3}$/.test(c)){
        const n=parseInt(c);
        if(n>0&&n<1000){qty=n;break;}
      }
    }
  }
  // 폴백: "N팩"/"N개" 패턴 (EA 못 찾았을 때만)
  if(qty===1&&eaIdx<0){
    for(const c of cols){
      const pm=c.match(/(\d+)\s*(팩|개)/);
      if(pm&&parseInt(pm[1])>0){qty=parseInt(pm[1]);break;}
    }
  }
  // 배송 주소: 한글 행정구역 단위 포함, 식봄 본사주소(동해시 대학로 16) 제외
  // 정규식 [가-힣](시|도|군|구|면|읍|로|길) — 한글 다음에 행정단위 와야 매칭
  // → "면세"(면이 첫글자, 한글 선행 없음)는 제외, "동구"/"동해시"/"대학로" 등은 매칭
  for(const c of cols){
    if(!c||!/[가-힣]/.test(c))continue;
    if(!/[가-힣](시|도|군|구|면|읍|로|길)/.test(c))continue;
    if(c.includes('동해시 대학로 16'))continue;
    if(c.length<6)continue;  // 짧은 문자열 안전망 (예: 단순 "남구")
    let cleaned=c.replace(/^\[\d{5}\]\s*/,'').trim();
    if(!cleaned)continue;
    const r=extractAddrPhone(cleaned);
    address=r.addr;msg=r.msg||'';
    break;
  }
  if(prodName&&address&&custPhone){
    return ['식봄','','010-2455-4156','',prodName+' x '+qty,custName,address,custPhone,msg].join('\t');
  }
  return null;
}
function preprocessSikbom(raw){
  const lines=raw.trim().split('\n').map(normLine).filter(Boolean);
  const output=[];
  // 1) 단일라인 형식 우선 시도 (한 줄에 모든 정보 들어오는 신형식)
  for(const ln of lines){
    if(!isOrderHdr(ln))continue;
    const parsed=parseSikbomSingleLine(ln);
    if(parsed)output.push(parsed);
  }
  if(output.length>0)return output.join('\n');
  // 2) 폴백: 멀티라인 형식 (헤더 + 블록 구조의 구형식)
  let i=0;
  while(i<lines.length){
    if(!isOrderHdr(lines[i])){i++;continue;}
    const h1=lines[i].split('\t');let custName='';
    const bi=h1.findIndex(c=>c.trim()==='발주대기');
    if(bi>=0&&h1[bi+1])custName=h1[bi+1].trim();
    i++;
    const block=[];
    while(i<lines.length&&!isOrderHdr(lines[i])){block.push(lines[i]);i++;}
    let custPhone='',prodName='',qty=1,address='',msg='';
    for(const bl of block){
      const cols=bl.split('\t');const c0=(cols[0]||'').trim();
      if(/^01\d{8,9}$/.test(c0)){
        if(!custPhone)custPhone=fp(c0);
        for(let j=1;j<cols.length;j++){const c=(cols[j]||'').trim();if(!prodName&&/^(버피|연안)\s+/.test(c)&&/\d+(g|kg)/i.test(c)){prodName=normSikbomProd(c);}}
        for(let j=1;j<cols.length;j++){const c=(cols[j]||'').trim();const pm=c.match(/(\d+)(팩|개)/);if(pm&&parseInt(pm[1])>0){qty=parseInt(pm[1]);break;}}
      }else if(/^[가-힣]/.test(c0)&&/\d+(g|kg)/i.test(c0)){
        if(!prodName)prodName=normSikbomProd(c0);
        if(!address){const raw13=(cols[13]||'').trim();if(raw13&&!raw13.includes('동해시')){const r=extractAddrPhone(raw13);address=r.addr;msg=r.msg;}}
      }else if(/^\d{5,}$/.test(c0)&&!address){
        const raw2=(cols[2]||'').trim();
        if(raw2&&/[가-힣]/.test(raw2)&&!raw2.includes('동해시')){const r=extractAddrPhone(raw2);address=r.addr;msg=r.msg;}
        if(!address){
          for(let j=1;j<cols.length;j++){
            const c=(cols[j]||'').trim();
            if(c&&/[가-힣]/.test(c)&&!c.includes('동해시')&&/(시|도|군|구|면|읍|로|길)/.test(c)){
              const r=extractAddrPhone(c);address=r.addr;
              if(r.msg){msg=r.msg;}
              else if(j+1<cols.length){
                const nxt=(cols[j+1]||'').trim();
                if(nxt&&nxt!=='-'&&!nxt.includes('동해시')&&!nxt.startsWith('['))msg=nxt;
              }
              break;
            }
          }
        }
      }
    }
    if(prodName&&address&&custPhone){output.push(['식봄','','010-2455-4156','',prodName+' x '+qty,custName,address,custPhone,msg].join('\t'));}
  }
  return output.join('\n');
}
// 직접발주 (채팅 형식: [제품]...[수취인]...) 파싱
function parseDirectOrders(input){
  const orders=[];
  const parts=input.split(/\[제품\]/);
  for(let i=1;i<parts.length;i++){
    const block=parts[i];
    const recipIdx=block.indexOf('[수취인]');
    if(recipIdx===-1)continue;
    const prodSection=block.substring(0,recipIdx);
    let recSection=block.substring(recipIdx+'[수취인]'.length);
    const nextProdIdx=recSection.search(/\[제품\]/);
    if(nextProdIdx>=0)recSection=recSection.substring(0,nextProdIdx);
    // 상품 파싱: "상품명 N개 / 가격원" 패턴, 배송비/총합/별표 라인 스킵
    // 상품명 앞의 "하남 " 접두어는 자동 제거
    const products=[];
    const prodLines=prodSection.split('\n').map(l=>l.trim()).filter(Boolean);
    for(const line of prodLines){
      if(/^(\*+\s*)?(배송비|총합|합계|결제금액|합산)/.test(line))continue;
      const m=line.match(/^(.+?)\s+(\d+)\s*개\b/);
      if(m){
        let nm=m[1].trim().replace(/^하남\s+/,'');
        products.push({name:nm,qty:parseInt(m[2])});
      }
    }
    // 수취인 파싱: "이름 / 전화" 형태, 주소 라인
    const recLines=recSection.split('\n').map(l=>l.trim()).filter(Boolean);
    let name='',phone='',addr='';
    for(const line of recLines){
      const slashIdx=line.indexOf('/');
      if(slashIdx>0){
        const before=line.substring(0,slashIdx).trim();
        const after=line.substring(slashIdx+1).trim();
        const afterDigits=after.replace(/[^0-9]/g,'');
        if(afterDigits.length>=9){name=before;phone=fp(after);continue;}
      }
      const lineDigits=line.replace(/[^0-9]/g,'');
      if(/^[\d\s\-]+$/.test(line)&&lineDigits.length>=9){phone=fp(line);continue;}
      if(line.length>5){addr=(addr?addr+' ':'')+line;}
      else if(!name){name=line;}
    }
    if(products.length>0)orders.push({products,name,phone,addr});
  }
  return orders;
}
function run(){
  wc=0;let input=document.getElementById('inp').value.trim();
  if(!input){sl('입력 데이터가 없습니다.','warn');return;}
  // 직접발주(채팅) 형식 자동 인식 — [제품] + [수취인] 마커
  if(input.includes('[제품]')&&input.includes('[수취인]')){
    const orders=parseDirectOrders(input);
    if(orders.length===0){sl('직접발주 파싱 실패 — [제품]/[수취인] 포맷 확인','warn');return;}
    const out=[];
    for(const ord of orders){
      // 합포장 — 한 수취인의 모든 상품을 한 줄로 슬래시 합침
      const combinedName=ord.products.map(p=>p.name+' x '+p.qty).join(' / ');
      // E=직접발주, F=수취인 이름, G=빈칸, H=수취인 전화, I=빈칸(창고명), J=합포장 상품, K=이름, L=주소, M=전화, N=빈칸
      out.push(['직접발주',ord.name||'','',ord.phone||'','',combinedName,ord.name,ord.addr,ord.phone,''].join('\t'));
    }
    document.getElementById('out').value=out.join('\n');
    document.getElementById('s-in').textContent=orders.length;
    document.getElementById('s-out').textContent=out.length;
    document.getElementById('in-count').textContent=orders.length+' 건';
    document.getElementById('out-count').textContent=out.length+' 행';
    autoResize(document.getElementById('inp'));autoResize(document.getElementById('out'));
    sl('직접발주 '+orders.length+'건 / '+out.length+'행 출력','ok');
    return;
  }
  if(is365BagenFormat(input)){
    input=preprocess365Bagen(input);
    if(!input){sl('365바겐 형식 파싱 실패','warn');return;}
    sl('365바겐 형식 감지 — 자동 변환 중...');
  }
  if(isSikbomFormat(input)){
    input=preprocessSikbom(input);
    if(!input){sl('식봄 데이터 파싱 실패','warn');return;}
    sl('식봄 형식 감지 — 자동 변환 중...');
  }
  if(isBoardFormat(input)){
    input=preprocessBoardFormat(input);
    if(!input){sl('게시판 발주 형식 파싱 실패','warn');return;}
    sl('게시판 발주 형식 감지 — 자동 변환 중...');
  }
  if(isKakaoOrderFormat(input)){
    input=preprocessKakaoOrder(input);
    if(!input){sl('카톡 발주 형식 파싱 실패','warn');return;}
    sl('카톡 발주 형식 감지 — 자동 변환 중...');
  }
  if(isVerticalKakaoFormat(input)){
    input=preprocessVerticalKakao(input);
    if(!input){sl('세로형 카톡 발주 파싱 실패','warn');return;}
    sl('세로형 카톡 발주 감지 — 자동 변환 중...');
  }
  const rules=parseRules();const lines=mergeLines(input);
  document.getElementById('s-in').textContent=lines.length;
  document.getElementById('in-count').textContent=lines.length+' 행';
  sl(lines.length+'행 처리 중...');
  const out=[];
  if(pendingHistory.length>0){dayHistory=dayHistory.concat(pendingHistory.filter(p=>!dayHistory.some(h=>h.key===p.key)));}
  pendingHistory=[];const dupNames=[];let lastRunClient='';
  for(const line of lines){
    const row=pr2(line);if(!row){sl('파싱 실패: '+line.slice(0,30),'warn');continue;}
    let{client,ca:cla,cp,prod,nameRaw,address,custPhone,msg,qty,qtyColValue}=row;
    if(!client&&lastRunClient)client=lastRunClient;else if(client)lastRunClient=client;
    if(client==='식봄'&&address.includes('동해시 대학로 16')){sl('식봄 대표님 주소 제외: '+nameRaw,'warn');continue;}
    let cfg=CC[client]||{};if(!CC[client])sl('미등록 업체: '+client,'warn');
    const iv=cfg.insert||'';
    const{name:rawName,qty:fq,maxB}=pp(client,prod,qty);
    const finalQty=fq*(qtyColValue||1);let name=rawName;
    for(const rule of rules){if(name.includes(rule.from))name=name.replace(rule.from,rule.to);}
    const dupKey=(nameRaw+'|'+address).replace(/\s/g,'');
    if(dayHistory.some(h=>h.key===dupKey))dupNames.push(nameRaw);
    const salesClient=cfg.insert||client;
    pendingHistory.push({client:salesClient,product:name,qty:finalQty,nameRaw,address,key:dupKey});
    const ord={address,custPhone,msg,ca:cla,cp};
    if(name.includes(' / ')){out.push(br(client,cfg,name,nameRaw,ord,iv));}
    else{let rem=finalQty;while(rem>0){const cur=Math.min(rem,maxB);out.push(br(client,cfg,name+' x '+cur,nameRaw,ord,iv));rem-=cur;}}
  }
  document.getElementById('out').value=out.join('\n');
  document.getElementById('s-out').textContent=out.length;
  document.getElementById('out-count').textContent=out.length+' 행';
  autoResize(document.getElementById('inp'));autoResize(document.getElementById('out'));
  document.getElementById('s-warn').textContent=wc;
  if(dupNames.length>0){sl('⚠️ 중복 발주 의심: '+dupNames.join(', '),'warn');}
  else{sl('완료 — '+out.length+'행 출력, 주의 '+wc+'건',wc>0?'warn':'ok');}
}
function copyOut(){const v=document.getElementById('out').value;if(!v)return;navigator.clipboard.writeText(v).then(()=>sl('클립보드에 복사됐어요!','ok'));}
function clearAll(){
  document.getElementById('inp').value='';document.getElementById('out').value='';
  ['s-in','s-out','s-warn'].forEach(id=>document.getElementById(id).textContent='0');
  document.getElementById('in-count').textContent='0 행';document.getElementById('out-count').textContent='0 행';
  autoResize(document.getElementById('inp'));autoResize(document.getElementById('out'));
  wc=0;sl('초기화됨');
}
function autoResize(el){
  el.style.height='auto';
  const maxH=Math.max(240,window.innerHeight*0.55); // 화면 55%까지만 자동 확장
  const needH=Math.max(200,el.scrollHeight);
  if(needH>maxH){el.style.height=maxH+'px';el.style.overflowY='auto';}
  else{el.style.height=needH+'px';el.style.overflowY='hidden';}
}
window.addEventListener('resize',function(){const i=document.getElementById('inp'),o=document.getElementById('out');if(i)autoResize(i);if(o)autoResize(o);});
document.addEventListener('DOMContentLoaded',function(){
  const inp=document.getElementById('inp');
  inp.addEventListener('input',function(){autoResize(inp);});
  autoResize(inp);autoResize(document.getElementById('out'));
});
