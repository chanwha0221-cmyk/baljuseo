<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상세페이지 메이커 — 마스터/새벽소리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===== 폰트 (baljuseo 호스팅) ===== */
@font-face{font-family:'Gmarket';src:url('fonts/GmarketSansTTFLight.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Gmarket';src:url('fonts/GmarketSansTTFMedium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Gmarket';src:url('fonts/GmarketSansTTFBold.ttf') format('truetype');font-weight:700;font-display:swap}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Gmarket','Malgun Gothic',sans-serif;background:#eceae5;color:#222;font-weight:300}
.app{display:flex;height:100vh;overflow:hidden}
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;z-index:50}
.topbar .logo{font-weight:700;font-size:16px;letter-spacing:1px}
.topbar .ver{font-size:11px;color:#888}
.modes{display:flex;gap:6px;margin-left:8px}
.mode-btn{padding:7px 16px;border-radius:20px;border:1.5px solid #555;background:transparent;color:#ccc;font-family:inherit;font-weight:500;font-size:13px;cursor:pointer}
.mode-btn.on{background:#fff;color:#1a1a1a;border-color:#fff}
.spacer{flex:1}
.act-btn{padding:8px 16px;border-radius:8px;border:none;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.act-jpg{background:#C0392B;color:#fff}
.act-html{background:#2C7A4B;color:#fff}
.act-btn:disabled{opacity:.5;cursor:default}

/* ===== 좌측 입력 ===== */
.panel{margin-top:54px;height:calc(100vh - 54px);overflow-y:auto}
.left{width:420px;flex:0 0 420px;background:#fff;border-right:1px solid #ddd;padding:18px}
.left h3{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.left h3:first-child{margin-top:0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:9px;font-family:inherit;font-size:13px;font-weight:300;outline:none;resize:vertical}
.fld textarea{min-height:80px;line-height:1.6}
.hint{font-size:11px;color:#aaa;margin-top:3px;line-height:1.4}
.dropzone{border:2px dashed #C0392B;border-radius:10px;padding:22px;text-align:center;color:#C0392B;font-weight:500;font-size:13px;cursor:pointer;background:#fff8f6}
.dropzone.drag{background:#ffe8e2}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.thumb{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid #ddd;cursor:grab}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .idx{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px}
.thumb .del{position:absolute;top:2px;right:2px;background:rgba(192,57,43,.9);color:#fff;width:16px;height:16px;border-radius:50%;font-size:11px;line-height:16px;text-align:center;cursor:pointer}
.minibtn{padding:6px 10px;border:1px solid #bbb;background:#f7f7f7;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}

/* ===== 우측 미리보기 ===== */
.right{flex:1;background:#d9d6d0;display:flex;justify-content:center;padding:24px}
.stage{width:860px;flex:0 0 860px}
#page{width:860px;background:#fff;overflow:hidden}

/* ===== 상세페이지 테마 ===== */
#page{--red:#C0392B;--gold:#C9A84C;--goldL:#F0D080;--cream:#FDF6EC;--dark:#1A0A00}
#page[data-mode="master"]{--red:#0E3A5F;--gold:#2BB3A3;--goldL:#7FD9CD;--cream:#EEF5F7;--dark:#06121C}
#page,#page *{font-family:'Gmarket','Malgun Gothic',sans-serif}
.hero{background:linear-gradient(150deg,var(--dark),var(--red));color:var(--goldL);padding:88px 50px;text-align:center;position:relative;background-size:cover;background-position:center}
.hero.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(0,0,0,.72),rgba(0,0,0,.45))}
.hero>*{position:relative;z-index:2}
.hero .brand{font-size:17px;letter-spacing:8px;font-weight:500;opacity:.9}
.hero h1{font-size:52px;font-weight:700;margin:18px 0;line-height:1.25;color:#fff;white-space:pre-line}
.hero .sub{font-size:21px;font-weight:300;opacity:.92}
.badges{display:flex;justify-content:center;gap:12px;padding:40px 30px;background:var(--cream);flex-wrap:wrap}
.badge{background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:16px 20px;text-align:center;color:var(--red);font-weight:500;font-size:16px}
.sec{padding:54px 50px}
.sec.alt{background:var(--cream)}
.sec h2{font-size:32px;font-weight:700;color:var(--red);margin-bottom:8px;white-space:pre-line}
.sec .ln{width:50px;height:4px;background:var(--gold);margin-bottom:22px}
.sec p{font-size:19px;line-height:1.9;font-weight:300;color:#333;white-space:pre-line}
.sec p b{font-weight:500;color:var(--dark)}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.grid img{width:calc(50% - 5px);border-radius:10px;display:block;object-fit:cover;filter:contrast(1.05) saturate(1.1)}
.grid.g1 img{width:100%}
.full img{width:100%;display:block;filter:contrast(1.05) saturate(1.1)}
.opts{padding:20px 50px 56px}
.opts h2{font-size:32px;font-weight:700;color:var(--red);padding-bottom:22px}
.opt{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #e3d8c4;border-radius:14px;padding:22px 26px;margin-bottom:14px;font-size:19px;gap:16px}
.opt.best{border:2.5px solid var(--red);background:var(--cream);position:relative}
.opt .nm{font-weight:500;white-space:nowrap}
.opt .ds{color:#555;text-align:right}
.opt .tag{position:absolute;top:-13px;left:24px;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:4px 13px;border-radius:20px}
.foot{background:var(--dark);color:var(--gold);text-align:center;padding:44px;font-size:21px;font-weight:500;letter-spacing:5px}
.empty{color:#bbb;text-align:center;padding:120px 20px;font-weight:500}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">상세페이지 메이커</span><span class="ver">v1.0</span>
  <div class="modes">
    <button class="mode-btn on" data-m="dawn" onclick="setMode('dawn')">🌅 새벽소리</button>
    <button class="mode-btn" data-m="master" onclick="setMode('master')">🐟 마스터</button>
  </div>
  <span class="spacer"></span>
  <button class="act-btn act-html" onclick="copyHtml()">📋 HTML 복사</button>
  <button class="act-btn act-jpg" onclick="downloadJpg()">🖼️ JPG 다운로드</button>
</div>

<div class="app">
  <div class="panel left">
    <h3>① 상품 정보 (소스 붙여넣기)</h3>
    <div class="fld">
      <label>전체 소스/설명 한 번에 붙여넣기</label>
      <textarea id="src" placeholder="상품 설명/페이지 소스를 통째로 붙여넣고 [자동 채우기]를 누르세요. 첫 줄=상품명, 나머지=본문으로 들어갑니다."></textarea>
      <button class="minibtn" onclick="autoFill()" style="margin-top:6px">⤵ 자동 채우기</button>
      <div class="hint">아래 칸을 직접 채워도 됩니다. 자동 채우기는 대략 나눠주는 보조 기능이에요.</div>
    </div>

    <h3>② 헤더</h3>
    <div class="fld"><label>상품명 (줄바꿈 가능)</label><input id="f_title" placeholder="지리산 산청&#10;흑돼지 뒷고기"></div>
    <div class="fld"><label>브랜드 표기</label><input id="f_brand" placeholder="새벽소리"></div>
    <div class="fld"><label>한 줄 소개</label><input id="f_sub" placeholder="매일 새벽 직접 손질 · 당일 산지직송"></div>
    <div class="fld"><label>강조 뱃지 (쉼표로 구분)</label><input id="f_badges" placeholder="지리산 산청, 순수 흑돼지, 냉장 생육, 당일 손질"></div>

    <h3>③ 본문</h3>
    <div class="fld"><label>소제목</label><input id="f_h2" placeholder="새벽소리가 직접 손질합니다"></div>
    <div class="fld"><label>본문 내용</label><textarea id="f_body" placeholder="청정 지리산 산청에서 자란 재래 흑돼지를 냉장 생육으로 보내드립니다..."></textarea>
      <div class="hint">**별표**로 감싸면 굵게 강조됩니다.</div></div>

    <h3>④ 사진 (드래그·여러 장)</h3>
    <div id="drop" class="dropzone" onclick="document.getElementById('file').click()">📷 사진을 끌어다 놓거나 클릭해서 업로드<br><span style="font-size:11px;opacity:.8">첫 장 = 히어로 배경 · 순서대로 배치</span></div>
    <input type="file" id="file" accept="image/*" multiple style="display:none">
    <div id="thumbs" class="thumbs"></div>

    <h3>⑤ 상품 구성</h3>
    <div class="fld"><label>옵션 (한 줄에 하나: 이름 | 구성, BEST는 앞에 *)</label>
      <textarea id="f_opts" placeholder="200g | 구이용 손질 조각 1팩&#10;1kg | 500g 필렛 × 2팩&#10;*2kg+600g | 필렛 4팩 + 조각 3팩 + 한 근 서비스"></textarea></div>

    <h3>⑥ 배송 안내 · 푸터</h3>
    <div class="fld"><label>배송 안내</label><textarea id="f_ship" placeholder="냉장 배송 · 당일 발송&#10;제주/도서산간 추가 배송비"></textarea></div>
    <div class="fld"><label>푸터 브랜드</label><input id="f_foot" placeholder="새벽소리"></div>
    <div style="height:40px"></div>
  </div>

  <div class="panel right">
    <div class="stage"><div id="page" data-mode="dawn"><div class="empty">왼쪽에 정보를 입력하면<br>여기 미리보기가 나타납니다</div></div></div>
  </div>
</div>

<script>
let MODE='dawn';
let PHOTOS=[]; // {id,data}
let dragId=null;

const $=id=>document.getElementById(id);
const FONT_BASE='https://chanwha0221-cmyk.github.io/baljuseo/fonts/';

function setMode(m){
  MODE=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  render();
}

// ===== 사진 업로드 =====
$('file').addEventListener('change',e=>addFiles(e.target.files));
const dz=$('drop');
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function addFiles(files){
  [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{PHOTOS.push({id:Date.now()+Math.random(),data:r.result});drawThumbs();render();};
    r.readAsDataURL(f);
  });
}
function drawThumbs(){
  $('thumbs').innerHTML=PHOTOS.map((p,i)=>
    `<div class="thumb" draggable="true" data-id="${p.id}"
       ondragstart="dragId='${p.id}'" ondragover="event.preventDefault()"
       ondrop="dropThumb('${p.id}')">
       <img src="${p.data}"><span class="idx">${i+1}</span>
       <span class="del" onclick="delPhoto('${p.id}')">×</span></div>`).join('');
}
function delPhoto(id){PHOTOS=PHOTOS.filter(p=>p.id!=id);drawThumbs();render();}
function dropThumb(targetId){
  if(dragId==null||dragId==targetId)return;
  const from=PHOTOS.findIndex(p=>p.id==dragId), to=PHOTOS.findIndex(p=>p.id==targetId);
  const [m]=PHOTOS.splice(from,1);PHOTOS.splice(to,0,m);dragId=null;drawThumbs();render();
}

// ===== 자동 채우기 =====
function autoFill(){
  const t=$('src').value.trim();if(!t)return;
  const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean);
  if(!$('f_title').value && lines[0]) $('f_title').value=lines[0];
  if(!$('f_body').value) $('f_body').value=lines.slice(1).join('\n');
  render();
}

// ===== 렌더 =====
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}

function buildHtml(){
  const title=$('f_title').value, brand=$('f_brand').value||(MODE==='master'?'마스터':'새벽소리');
  const sub=$('f_sub').value, badges=$('f_badges').value.split(',').map(s=>s.trim()).filter(Boolean);
  const h2=$('f_h2').value, body=$('f_body').value;
  const foot=$('f_foot').value||brand;
  const ship=$('f_ship').value;
  const opts=$('f_opts').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const best=l.startsWith('*'); const [nm,...rest]=l.replace(/^\*/,'').split('|');
    return {best,nm:(nm||'').trim(),ds:rest.join('|').trim()};
  });
  const ph=PHOTOS.map(p=>p.data);
  if(!title && ph.length===0) return '<div class="empty">왼쪽에 정보를 입력하면<br>여기 미리보기가 나타납니다</div>';

  let h='';
  const heroBg=ph[0]?`background-image:url('${ph[0]}')`:'';
  h+=`<div class="hero ${ph[0]?'bg':''}" style="${heroBg}">
    ${brand?`<div class="brand">${esc(brand).split('').join(' ')}</div>`:''}
    <h1>${esc(title)}</h1>
    ${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`;
  if(badges.length) h+=`<div class="badges">${badges.map(b=>`<div class="badge">${esc(b)}</div>`).join('')}</div>`;
  if(h2||body||ph.length>1){
    h+=`<div class="sec">`;
    if(h2)h+=`<h2>${esc(h2)}</h2><div class="ln"></div>`;
    if(body)h+=`<p>${bold(body)}</p>`;
    const g=ph.slice(1,4);
    if(g.length)h+=`<div class="grid ${g.length===1?'g1':''}">${g.map(s=>`<img src="${s}">`).join('')}</div>`;
    h+=`</div>`;
  }
  const g2=ph.slice(4,8);
  if(g2.length){
    h+=`<div class="sec alt"><h2>이렇게 즐기세요</h2><div class="ln"></div>
      <div class="grid">${g2.map(s=>`<img src="${s}">`).join('')}</div></div>`;
  }
  ph.slice(8).forEach(s=>{h+=`<div class="full"><img src="${s}"></div>`;});
  if(opts.length){
    h+=`<div class="opts"><h2>상품 구성</h2>`;
    opts.forEach(o=>{h+=`<div class="opt ${o.best?'best':''}">${o.best?'<span class="tag">BEST</span>':''}
      <span class="nm">${esc(o.nm)}</span><span class="ds">${esc(o.ds)}</span></div>`;});
    h+=`</div>`;
  }
  if(ship)h+=`<div class="sec alt"><h2>배송 안내</h2><div class="ln"></div><p>${bold(ship)}</p></div>`;
  h+=`<div class="foot">${esc(foot).split('').join(' ')}</div>`;
  return h;
}

function render(){
  const pg=$('page');
  pg.dataset.mode=MODE;
  pg.innerHTML=buildHtml();
}

['f_title','f_brand','f_sub','f_badges','f_h2','f_body','f_opts','f_ship','f_foot']
  .forEach(id=>$(id).addEventListener('input',render));

// ===== JPG 다운로드 =====
async function downloadJpg(){
  const title=$('f_title').value.replace(/\n/g,' ').trim()||'상세페이지';
  if($('page').querySelector('.empty')){alert('내용을 먼저 입력하세요.');return;}
  await document.fonts.ready;
  const node=$('page');
  const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:'#ffffff',width:860,windowWidth:860});
  canvas.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=title.replace(/[\\/:*?"<>|]/g,'')+'_상세.jpg';
    a.click();
  },'image/jpeg',0.92);
}

// ===== HTML 복사 (독립 실행 가능한 통짜 HTML) =====
function copyHtml(){
  if($('page').querySelector('.empty')){alert('내용을 먼저 입력하세요.');return;}
  const vars=MODE==='master'
    ?'--red:#0E3A5F;--gold:#2BB3A3;--goldL:#7FD9CD;--cream:#EEF5F7;--dark:#06121C'
    :'--red:#C0392B;--gold:#C9A84C;--goldL:#F0D080;--cream:#FDF6EC;--dark:#1A0A00';
  const css=document.querySelector('style').textContent
    .replace(/url\('fonts\//g,"url('"+FONT_BASE);
  const full=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<style>${css}</style></head><body>
<div id="page" data-mode="${MODE}" style="${vars};max-width:860px;margin:0 auto">${buildHtml()}</div>
</body></html>`;
  navigator.clipboard.writeText(full).then(()=>{
    const btn=document.querySelector('.act-html');const o=btn.textContent;
    btn.textContent='✓ 복사됨';setTimeout(()=>btn.textContent=o,1500);
  },()=>alert('복사 실패 — 브라우저 권한을 확인하세요.'));
}
render();
</script>
</body>
</html>
